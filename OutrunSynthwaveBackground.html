<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro 80s Outrun Synthwave Sunset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #030208;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Full-viewport responsive SVG container */
    #scene-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #0d071e 0%, #030208 100%);
    }

    svg#outrun-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="scene-container">
    <!-- Pure SVG viewport with generous aspect ratio so desktop & mobile fill cleanly -->
    <svg id="outrun-svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Deep space sky gradient -->
        <linearGradient id="sky-base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#030208" />
          <stop offset="28%" stop-color="#080516" />
          <stop offset="52%" stop-color="#190a2c" />
          <stop offset="68%" stop-color="#2a1040" />
          <stop offset="100%" stop-color="#05030d" />
        </linearGradient>

        <!-- Asymmetric magenta-left / blue-right horizon nebula glow matching reference -->
        <radialGradient id="magenta-nebula" cx="28%" cy="54%" r="55%">
          <stop offset="0%" stop-color="#8b185a" stop-opacity="0.48" />
          <stop offset="45%" stop-color="#450e3c" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="blue-nebula" cx="74%" cy="52%" r="55%">
          <stop offset="0%" stop-color="#183a7a" stop-opacity="0.48" />
          <stop offset="45%" stop-color="#121e4a" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Central sun aura behind sun -->
        <radialGradient id="sun-aura-grad" cx="50%" cy="52%" r="42%">
          <stop offset="0%" stop-color="#ff3b8d" stop-opacity="0.65" />
          <stop offset="35%" stop-color="#8d2478" stop-opacity="0.32" />
          <stop offset="70%" stop-color="#25164a" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Retro Outrun Sun vertical gradient -->
        <linearGradient id="sun-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fff04d" />
          <stop offset="14%" stop-color="#ffd03b" />
          <stop offset="30%" stop-color="#ff9944" />
          <stop offset="48%" stop-color="#ff6663" />
          <stop offset="68%" stop-color="#fa387c" />
          <stop offset="100%" stop-color="#e31274" />
        </linearGradient>

        <!-- Distant horizon valley atmospheric glow -->
        <radialGradient id="valley-horizon-glow" cx="50%" cy="57%" r="22%">
          <stop offset="0%" stop-color="#b7d4ff" stop-opacity="0.85" />
          <stop offset="35%" stop-color="#6c8cff" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Gaussian blur filter for soft sun & hero star glow -->
        <filter id="sun-outer-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
          <feMerge>
            <feMergeNode in="blur1" />
            <feMergeNode in="blur2" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="star-glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Dynamic ClipPath for the Outrun Sun scanline stripes -->
        <clipPath id="sun-stripes-clip">
          <!-- Populated and updated dynamically by JS in 3D screen space -->
        </clipPath>
      </defs>

      <!-- Layer 1: Sky Backdrop & Nebula Gradients -->
      <g id="layer-sky">
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#sky-base-grad)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#magenta-nebula)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#blue-nebula)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#sun-aura-grad)" />
      </g>

      <!-- Layer 2: 3D Parallax Starfield (Circle over 4-point star) -->
      <g id="layer-stars"></g>

      <!-- Layer 3: 3D Projected Outrun Sun -->
      <g id="layer-sun">
        <!-- Soft glowing halo behind the sun -->
        <circle id="sun-halo" cx="600" cy="480" r="235" fill="url(#sun-body-grad)" opacity="0.32" filter="url(#sun-outer-glow)" />
        <!-- Main striped sun body -->
        <circle id="sun-disc" cx="600" cy="480" r="230" fill="url(#sun-body-grad)" clip-path="url(#sun-stripes-clip)" />
      </g>

      <!-- Layer 4: Subtle horizon mist behind mountains -->
      <rect x="0" y="320" width="1200" height="320" fill="url(#valley-horizon-glow)" pointer-events="none" />

      <!-- Layer 5: Unified Back-to-Front 3D Terrain & Roadway Depth Slices (SVG Polygons) -->
      <g id="layer-world"></g>
    </svg>
  </div>

  <script>
    (function () {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const VIEW_W = 1200;
      const VIEW_H = 900;
      const FOCAL_LENGTH = 560;

      // Camera state: lowered closer to the roadway surface and advancing slowly toward the horizon
      const CAMERA_ROAD_CLEARANCE = 7.2;
      const camera = {
        x: 0,
        y: CAMERA_ROAD_CLEARANCE,
        z: 0,
        speed: 14.0
      };

      // DOM Layer references
      const starsLayer = document.getElementById("layer-stars");
      const worldLayer = document.getElementById("layer-world");
      const sunHalo = document.getElementById("sun-halo");
      const sunDisc = document.getElementById("sun-disc");
      const sunClip = document.getElementById("sun-stripes-clip");

      // =========================================================================
      // 1. DETERMINISTIC NOISE, 3D PROJECTION & ROAD PATH
      // =========================================================================
      const ROAD_HALF_WIDTH = 4.6;

      function hash2(x, z) {
        const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
        return s - Math.floor(s);
      }

      function valueNoise2D(x, z) {
        const ix = Math.floor(x);
        const iz = Math.floor(z);
        const fx = x - ix;
        const fz = z - iz;
        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uz = fz * fz * (3.0 - 2.0 * fz);

        const a = hash2(ix, iz);
        const b = hash2(ix + 1, iz);
        const c = hash2(ix, iz + 1);
        const d = hash2(ix + 1, iz + 1);

        return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
      }

      function fbm2D(x, z) {
        let sum = 0.0;
        let amp = 0.55;
        let freq = 1.0;
        for (let i = 0; i < 4; i++) {
          sum += amp * valueNoise2D(x * freq, z * freq);
          freq *= 2.04;
          amp *= 0.48;
        }
        return sum;
      }

      function getRoadPathAtZ(wz) {
        const bendFactor = Math.max(0.0, Math.min(1.0, (wz - 18.0) / 140.0));
        const x =
          (Math.sin(wz * 0.014) * 26.0 + Math.sin(wz * 0.0055 + 0.6) * 18.0) *
          bendFactor;
        const hillFactor = Math.max(0.0, Math.min(1.0, (wz - 24.0) / 160.0));
        const y =
          (Math.sin(wz * 0.011) * 5.2 + Math.cos(wz * 0.0045) * 3.4) *
          hillFactor;
        return { x, y };
      }

      function computeStaticTerrainHeight(wx, wz) {
        const road = getRoadPathAtZ(wz);
        const distFromRoad = Math.abs(wx - road.x);
        const corridorHalfW = ROAD_HALF_WIDTH + 3.2;

        if (distFromRoad <= corridorHalfW) {
          return road.y;
        }

        const flatRamp = Math.max(0.0, Math.min(1.0, (wz - 55.0) / 135.0));
        const ridgeSpan = Math.max(0.0, Math.min(1.0, (distFromRoad - corridorHalfW) / 38.0));
        const ridgeProfile = ridgeSpan * ridgeSpan * (3.0 - 2.0 * ridgeSpan);

        const n1 = fbm2D(wx * 0.032 + 11.4, wz * 0.022 + 5.7);
        const n2 = valueNoise2D(wx * 0.085 - 3.2, wz * 0.065 + 19.1);
        const mountainHeight = (n1 * 46.0 + n2 * 12.0) * ridgeProfile * flatRamp;

        return road.y + mountainHeight;
      }

      function conformHeightmapToRoadSurface(gridHeights, numRows, numCols, cellW, cellD) {
        const bakedRoadY = new Float32Array(numRows);
        const clearanceHalfW = ROAD_HALF_WIDTH + 2.4;
        const blendBand = 7.5;

        for (let r = 0; r < numRows; r++) {
          const wz = r * cellD;
          const road = getRoadPathAtZ(wz);
          bakedRoadY[r] = road.y;
          const row = gridHeights[r];

          for (let c = 0; c <= numCols; c++) {
            const wx = (c - numCols * 0.5) * cellW;
            const d = Math.abs(wx - road.x);
            if (d <= clearanceHalfW) {
              row[c] = road.y;
            } else if (d < clearanceHalfW + blendBand) {
              const t = (d - clearanceHalfW) / blendBand;
              const smooth = t * t * (3.0 - 2.0 * t);
              row[c] = road.y + (row[c] - road.y) * smooth;
            }
          }
        }
        return bakedRoadY;
      }

      function project3D(wx, wy, wz) {
        const dz = wz - camera.z;
        if (dz <= 0.15) return null;
        const scale = FOCAL_LENGTH / dz;
        const sx = VIEW_W * 0.5 + (wx - camera.x) * scale;
        const sy = VIEW_H * 0.56 - (wy - camera.y) * scale;
        return { x: sx, y: sy, scale };
      }

      // =========================================================================
      // 2. 3D PARALLAX STARFIELD (CIRCLE OVER 4-POINT STAR)
      // =========================================================================
      const stars = [];
      const STAR_COUNT = 165;

      function createFourPointStarPath(cx, cy, outerR, innerR) {
        return (
          `M ${cx.toFixed(2)} ${(cy - outerR).toFixed(2)} ` +
          `L ${(cx + innerR).toFixed(2)} ${(cy - innerR).toFixed(2)} ` +
          `L ${(cx + outerR).toFixed(2)} ${cy.toFixed(2)} ` +
          `L ${(cx + innerR).toFixed(2)} ${(cy + innerR).toFixed(2)} ` +
          `L ${cx.toFixed(2)} ${(cy + outerR).toFixed(2)} ` +
          `L ${(cx - innerR).toFixed(2)} ${(cy + innerR).toFixed(2)} ` +
          `L ${(cx - outerR).toFixed(2)} ${cy.toFixed(2)} ` +
          `L ${(cx - innerR).toFixed(2)} ${(cy - innerR).toFixed(2)} Z`
        );
      }

      function initStars() {
        const starColors = ["#ffffff", "#dbeafe", "#fce7f3", "#93c5fd", "#f5d0fe"];
        for (let i = 0; i < STAR_COUNT; i++) {
          const isHero = i % 16 === 0;
          const wz = 700 + hash2(i, 1.3) * 2600;
          const wx = (hash2(i, 4.7) - 0.5) * 5200;
          const wy = 140 + hash2(i, 9.1) * 1950;
          const baseRadius = isHero ? 2.4 + hash2(i, 2.2) * 1.4 : 0.8 + hash2(i, 3.5) * 1.1;
          const color = starColors[i % starColors.length];
          const phase = hash2(i, 7.8) * Math.PI * 2;

          const g = document.createElementNS(SVG_NS, "g");
          if (isHero) {
            g.setAttribute("filter", "url(#star-glow)");
          }

          const starPath = document.createElementNS(SVG_NS, "path");
          starPath.setAttribute("fill", color);
          starPath.setAttribute("opacity", isHero ? "0.9" : "0.65");

          const coreCircle = document.createElementNS(SVG_NS, "circle");
          coreCircle.setAttribute("fill", "#ffffff");

          g.appendChild(starPath);
          g.appendChild(coreCircle);
          starsLayer.appendChild(g);

          stars.push({
            wx,
            wy,
            wz,
            baseRadius,
            isHero,
            phase,
            g,
            starPath,
            coreCircle
          });
        }
      }

      function updateStars(elapsedSec) {
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const effZ = st.wz - camera.z * 0.35;
          if (effZ <= 50) {
            st.g.setAttribute("display", "none");
            continue;
          }
          const scale = FOCAL_LENGTH / effZ;
          const sx = VIEW_W * 0.5 + (st.wx - camera.x * 0.12) * scale;
          const sy = VIEW_H * 0.54 - (st.wy - camera.y * 0.08) * scale;

          if (sx < -60 || sx > VIEW_W + 60 || sy < -60 || sy > VIEW_H * 0.68) {
            st.g.setAttribute("display", "none");
            continue;
          }

          st.g.setAttribute("display", "inline");
          const twinkle = 0.82 + 0.18 * Math.sin(elapsedSec * 2.4 + st.phase);
          const r = Math.max(0.55, st.baseRadius * (1450 / effZ) * twinkle);
          const spikeOuter = r * (st.isHero ? 5.2 : 2.8);
          const spikeInner = r * 0.42;

          st.starPath.setAttribute("d", createFourPointStarPath(sx, sy, spikeOuter, spikeInner));
          st.coreCircle.setAttribute("cx", sx.toFixed(2));
          st.coreCircle.setAttribute("cy", sy.toFixed(2));
          st.coreCircle.setAttribute("r", r.toFixed(2));
        }
      }

      // =========================================================================
      // 3. 3D PROJECTED RETRO OUTRUN SUN WITH SCANLINE STRIPES
      // =========================================================================
      const SUN_START_Z = 5075;
      const SUN_WORLD_RADIUS = 1960;
      const SUN_WORLD_Y = 390;

      const stripeRects = [];
      const STRIPE_COUNT = 9;
      for (let i = 0; i < STRIPE_COUNT; i++) {
        const rect = document.createElementNS(SVG_NS, "rect");
        sunClip.appendChild(rect);
        stripeRects.push(rect);
      }

      function updateSun() {
        const dz = Math.max(400, SUN_START_Z - camera.z);
        const scale = FOCAL_LENGTH / dz;
        const sx = VIEW_W * 0.5 - camera.x * 0.04 * scale;
        const sy = VIEW_H * 0.56 - (SUN_WORLD_Y - camera.y * 0.04) * scale;
        const sr = SUN_WORLD_RADIUS * scale;

        sunDisc.setAttribute("cx", sx.toFixed(2));
        sunDisc.setAttribute("cy", sy.toFixed(2));
        sunDisc.setAttribute("r", sr.toFixed(2));

        sunHalo.setAttribute("cx", sx.toFixed(2));
        sunHalo.setAttribute("cy", sy.toFixed(2));
        sunHalo.setAttribute("r", (sr * 1.05).toFixed(2));

        const topY = sy - sr;
        const totalH = sr * 2;
        const splitY = sy - sr * 0.18;

        // Top solid crown of sun
        stripeRects[0].setAttribute("x", (sx - sr - 10).toFixed(2));
        stripeRects[0].setAttribute("y", (topY - 4).toFixed(2));
        stripeRects[0].setAttribute("width", (sr * 2 + 20).toFixed(2));
        stripeRects[0].setAttribute("height", Math.max(0, splitY - topY + 4).toFixed(2));

        // Lower horizontal Venetian-blind bars
        const lowerStart = splitY;
        const lowerHeight = topY + totalH - lowerStart;
        const bandCount = STRIPE_COUNT - 1;
        const step = lowerHeight / bandCount;

        for (let b = 0; b < bandCount; b++) {
          const t = b / bandCount;
          const gapRatio = 0.07 + t * 0.24;
          const barY = lowerStart + b * step + step * gapRatio * 0.5;
          const barH = Math.max(0.5, step * (1.0 - gapRatio));

          const rect = stripeRects[b + 1];
          rect.setAttribute("x", (sx - sr - 10).toFixed(2));
          rect.setAttribute("y", barY.toFixed(2));
          rect.setAttribute("width", (sr * 2 + 20).toFixed(2));
          rect.setAttribute("height", barH.toFixed(2));
        }
      }

      // =========================================================================
      // 4. PRE-GENERATED STRIP OBJECTS (TERRAIN PART + ROAD PART) & RENDERING
      // =========================================================================
      const COLS = 84;
      const VISIBLE_STRIP_COUNT = 52; // Controls how many strips in front of the camera are rendered
      const CELL_W = 4.2;
      const CELL_D = 7.0;
      const TOTAL_HEIGHTMAP_ROWS = 480;
      const TOTAL_STRIPS = TOTAL_HEIGHTMAP_ROWS - 1;

      // Step A: Build raw grid vertex heights & conform road corridor before generating strip objects
      const rawGridHeights = new Array(TOTAL_HEIGHTMAP_ROWS);
      for (let r = 0; r < TOTAL_HEIGHTMAP_ROWS; r++) {
        const wz = r * CELL_D;
        const rowHeights = new Float32Array(COLS + 1);
        for (let c = 0; c <= COLS; c++) {
          const wx = (c - COLS * 0.5) * CELL_W;
          rowHeights[c] = computeStaticTerrainHeight(wx, wz);
        }
        rawGridHeights[r] = rowHeights;
      }

      const bakedRoadSurfaceY = conformHeightmapToRoadSurface(
        rawGridHeights,
        TOTAL_HEIGHTMAP_ROWS,
        COLS,
        CELL_W,
        CELL_D
      );

      // Step B: Pre-generate an immutable array of strip objects, each containing:
      //   - strip.terrain: precomputed 3D tile quads & elevation flags for this strip
      //   - strip.road: precomputed 3D deck, side rails, yellow edge lines, & dashed teal center line
      function buildPregeneratedStrips() {
        const strips = new Array(TOTAL_STRIPS);
        const railDrop = 1.15;
        const sideInset = ROAD_HALF_WIDTH * 0.86;
        const sideLineHalfW = 0.24;
        const centerHalfW = 0.22;
        const lineLift = 0.05;

        for (let s = 0; s < TOTAL_STRIPS; s++) {
          const wz0 = s * CELL_D;
          const wz1 = (s + 1) * CELL_D;
          const hRow0 = rawGridHeights[s];
          const hRow1 = rawGridHeights[s + 1];
          const r0Y = bakedRoadSurfaceY[s];
          const r1Y = bakedRoadSurfaceY[s + 1];
          const stripRoadMidY = (r0Y + r1Y) * 0.5;

          // Pre-generate terrain part (COLS quad cells spanning [wz0, wz1])
          const terrainCells = new Array(COLS);
          for (let c = 0; c < COLS; c++) {
            const wx0 = (c - COLS * 0.5) * CELL_W;
            const wx1 = (c + 1 - COLS * 0.5) * CELL_W;
            const y00 = hRow0[c];
            const y10 = hRow0[c + 1];
            const y11 = hRow1[c + 1];
            const y01 = hRow1[c];
            const maxElev = Math.max(y00, y10, y11, y01);
            const isMountain = Math.max(0.0, maxElev - stripRoadMidY) > 2.2;

            terrainCells[c] = Object.freeze({
              wx0,
              wx1,
              y00,
              y10,
              y11,
              y01,
              isMountain
            });
          }

          // Pre-generate road part (deck, rails, yellow edge lines, & dashed teal center line)
          const road0 = getRoadPathAtZ(wz0);
          const road1 = getRoadPathAtZ(wz1);

          const r0LeftX = road0.x - ROAD_HALF_WIDTH;
          const r0RightX = road0.x + ROAD_HALF_WIDTH;
          const r1LeftX = road1.x - ROAD_HALF_WIDTH;
          const r1RightX = road1.x + ROAD_HALF_WIDTH;

          const roadPart = Object.freeze({
            r0LeftX,
            r0RightX,
            r1LeftX,
            r1RightX,
            r0Y,
            r1Y,
            railDrop,
            leftYellow0A: road0.x - sideInset - sideLineHalfW,
            leftYellow0B: road0.x - sideInset + sideLineHalfW,
            leftYellow1A: road1.x - sideInset - sideLineHalfW,
            leftYellow1B: road1.x - sideInset + sideLineHalfW,
            rightYellow0A: road0.x + sideInset - sideLineHalfW,
            rightYellow0B: road0.x + sideInset + sideLineHalfW,
            rightYellow1A: road1.x + sideInset - sideLineHalfW,
            rightYellow1B: road1.x + sideInset + sideLineHalfW,
            center0A: road0.x - centerHalfW,
            center0B: road0.x + centerHalfW,
            center1A: road1.x - centerHalfW,
            center1B: road1.x + centerHalfW,
            lineLift,
            hasCenterDash: (s % 2) === 0
          });

          strips[s] = Object.freeze({
            index: s,
            wz0,
            wz1,
            terrain: Object.freeze({
              cells: Object.freeze(terrainCells)
            }),
            road: roadPart
          });
        }

        return Object.freeze(strips);
      }

      const pregeneratedStrips = buildPregeneratedStrips();

      // Reusable SVG element pool sized strictly to VISIBLE_STRIP_COUNT.
      // Only strips in front of the camera [0 .. VISIBLE_STRIP_COUNT - 1] are rendered.
      const visibleStripSlots = [];
      for (let i = 0; i < VISIBLE_STRIP_COUNT; i++) {
        const sliceGroup = document.createElementNS(SVG_NS, "g");
        const terrainGroup = document.createElementNS(SVG_NS, "g");
        const roadGroup = document.createElementNS(SVG_NS, "g");
        sliceGroup.appendChild(terrainGroup);
        sliceGroup.appendChild(roadGroup);

        const terrainPolys = [];
        for (let c = 0; c < COLS; c++) {
          const poly = document.createElementNS(SVG_NS, "polygon");
          terrainGroup.appendChild(poly);
          terrainPolys.push(poly);
        }

        const roadDeckPoly = document.createElementNS(SVG_NS, "polygon");
        const roadLeftRailPoly = document.createElementNS(SVG_NS, "polygon");
        const roadRightRailPoly = document.createElementNS(SVG_NS, "polygon");
        const roadLeftYellowLine = document.createElementNS(SVG_NS, "polygon");
        const roadRightYellowLine = document.createElementNS(SVG_NS, "polygon");
        const roadCenterTealLine = document.createElementNS(SVG_NS, "polygon");

        roadGroup.appendChild(roadDeckPoly);
        roadGroup.appendChild(roadLeftRailPoly);
        roadGroup.appendChild(roadRightRailPoly);
        roadGroup.appendChild(roadLeftYellowLine);
        roadGroup.appendChild(roadRightYellowLine);
        roadGroup.appendChild(roadCenterTealLine);

        visibleStripSlots.push({
          group: sliceGroup,
          terrainPolys,
          roadDeckPoly,
          roadLeftRailPoly,
          roadRightRailPoly,
          roadLeftYellowLine,
          roadRightYellowLine,
          roadCenterTealLine
        });
      }

      // Append furthest visible slot first and closest slot last so nearer strips
      // always paint on top of distant strips in SVG document order.
      for (let i = VISIBLE_STRIP_COUNT - 1; i >= 0; i--) {
        worldLayer.appendChild(visibleStripSlots[i].group);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpRgb(c1, c2, t) {
        const clamped = Math.max(0.0, Math.min(1.0, t));
        const r = Math.round(lerp(c1[0], c2[0], clamped));
        const g = Math.round(lerp(c1[1], c2[1], clamped));
        const b = Math.round(lerp(c1[2], c2[2], clamped));
        return `rgb(${r}, ${g}, ${b})`;
      }

      function formatPoints(pts) {
        return pts.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      }

      function sampleBakedRoadSurfaceY(worldRowFloat) {
        const clampedRow = Math.max(0.0, Math.min(TOTAL_HEIGHTMAP_ROWS - 1.001, worldRowFloat));
        const r0 = Math.floor(clampedRow);
        const r1 = Math.min(TOTAL_HEIGHTMAP_ROWS - 1, r0 + 1);
        const frac = clampedRow - r0;
        const y0 = bakedRoadSurfaceY[r0];
        const y1 = bakedRoadSurfaceY[r1];
        return y0 + (y1 - y0) * frac;
      }

      // =========================================================================
      // 4B. PROCEDURAL FLAT POLYGON PALM TREE SPRITES BESIDE ROAD SEGMENTS
      // =========================================================================
      // Generates a closed 2D polygon outline (in normalized tree units where
      // base = (0, 0) and crown height = 1.0) representing a synthwave palm tree
      // silhouette with a curved segmented trunk and radiating jagged fronds.
      function buildPalmPolygonTemplate(leanDir, variantSeed) {
        const pts = [];
        const trunkSteps = 9;
        const trunkTopY = 0.72;
        const leanX = leanDir * (0.09 + variantSeed * 0.06);

        // Left trunk edge (bottom to top)
        for (let i = 0; i <= trunkSteps; i++) {
          const t = i / trunkSteps;
          const y = t * trunkTopY;
          const cx = leanX * (t * t);
          const halfW = lerp(0.036, 0.015, t);
          pts.push([cx - halfW, y]);
        }

        const crownX = leanX;
        const crownY = trunkTopY + 0.02;

        // Radiating palm fronds (left-lower -> left-upper -> top -> right-upper -> right-lower)
        const frondSpecs = [
          { angle: 2.88, len: 0.29, droop: 0.09, width: 0.032 },
          { angle: 2.48, len: 0.34, droop: 0.07, width: 0.035 },
          { angle: 2.02, len: 0.31, droop: 0.04, width: 0.033 },
          { angle: 1.56, len: 0.25, droop: 0.02, width: 0.028 },
          { angle: 1.12, len: 0.31, droop: 0.04, width: 0.033 },
          { angle: 0.66, len: 0.34, droop: 0.07, width: 0.035 },
          { angle: 0.26, len: 0.29, droop: 0.09, width: 0.032 }
        ];

        for (let f = 0; f < frondSpecs.length; f++) {
          const spec = frondSpecs[f];
          const a = spec.angle + (variantSeed - 0.5) * 0.08;
          const dirX = Math.cos(a);
          const dirY = Math.sin(a);
          const perpX = -dirY;
          const perpY = dirX;

          // Upper serrated edge out to frond tip
          const segs = 4;
          for (let s = 1; s <= segs; s++) {
            const u = s / segs;
            const drop = spec.droop * u * u;
            const px = crownX + dirX * spec.len * u;
            const py = crownY + dirY * spec.len * u - drop;
            const bladeW = spec.width * (1.0 - u * 0.85);
            pts.push([px + perpX * bladeW, py + perpY * bladeW]);
          }

          // Frond tip
          const tipX = crownX + dirX * (spec.len * 1.06);
          const tipY = crownY + dirY * (spec.len * 1.06) - spec.droop * 1.12;
          pts.push([tipX, tipY]);

          // Lower edge returning toward crown hub
          for (let s = segs - 1; s >= 1; s--) {
            const u = s / segs;
            const drop = spec.droop * u * u;
            const px = crownX + dirX * spec.len * u;
            const py = crownY + dirY * spec.len * u - drop;
            const bladeW = spec.width * 0.65 * (1.0 - u * 0.7);
            pts.push([px - perpX * bladeW, py - perpY * bladeW]);
          }

          // Return notch near crown center
          pts.push([crownX + dirX * 0.03, crownY + dirY * 0.03 - 0.012]);
        }

        // Right trunk edge (top to bottom)
        for (let i = trunkSteps; i >= 0; i--) {
          const t = i / trunkSteps;
          const y = t * trunkTopY;
          const cx = leanX * (t * t);
          const halfW = lerp(0.036, 0.015, t);
          pts.push([cx + halfW, y]);
        }

        return Object.freeze(pts);
      }

      const PALM_TEMPLATES = Object.freeze([
        buildPalmPolygonTemplate(-1, 0.2),
        buildPalmPolygonTemplate(1, 0.5),
        buildPalmPolygonTemplate(-1, 0.8),
        buildPalmPolygonTemplate(1, 0.15)
      ]);

      // Sample ground height from pre-conformed grid at arbitrary (wx, stripIndex)
      function sampleStripGroundY(stripIndex, wx) {
        const colFloat = wx / CELL_W + COLS * 0.5;
        const c0 = Math.max(0, Math.min(COLS, Math.floor(colFloat)));
        const c1 = Math.max(0, Math.min(COLS, c0 + 1));
        const frac = Math.max(0.0, Math.min(1.0, colFloat - c0));
        const row = rawGridHeights[stripIndex];
        return row[c0] + (row[c1] - row[c0]) * frac;
      }

      // Pre-assign random palm tree placements to random road strips before rendering
      const stripPalmPlacements = new Array(TOTAL_STRIPS).fill(null);
      let nextSpawnStrip = 5;
      for (let s = 5; s < TOTAL_STRIPS - 2; s++) {
        if (s < nextSpawnStrip) continue;
        const r = hash2(s, 31.7);
        if (r > 0.36) {
          const wzMid = (s + 0.5) * CELL_D;
          const roadMid = getRoadPathAtZ(wzMid);
          const side = hash2(s, 53.1) < 0.5 ? -1 : 1;
          const lateralOffset = ROAD_HALF_WIDTH + 2.8 + hash2(s, 71.9) * 5.2;
          const wx = roadMid.x + side * lateralOffset;
          const groundY = sampleStripGroundY(s, wx);
          const worldHeight = 14.5 + hash2(s, 89.3) * 5.5;
          const templateIdx = Math.floor(hash2(s, 17.4) * PALM_TEMPLATES.length);

          stripPalmPlacements[s] = Object.freeze({
            wx,
            wy: groundY - 0.15,
            wz: wzMid,
            worldHeight,
            template: PALM_TEMPLATES[templateIdx]
          });

          // Advance by a random interval of 3 to 9 road strips
          nextSpawnStrip = s + 3 + Math.floor(hash2(s, 97.2) * 7);
        }
      }

      // Attach a flat polygon element to each visible strip slot for its palm tree sprite
      for (let i = 0; i < VISIBLE_STRIP_COUNT; i++) {
        const palmPoly = document.createElementNS(SVG_NS, "polygon");
        palmPoly.setAttribute("display", "none");
        visibleStripSlots[i].group.appendChild(palmPoly);
        visibleStripSlots[i].palmPoly = palmPoly;
      }

      // Renders a single pre-generated strip object (both its terrain part and road part)
      // into the specified visible SVG slot.
      function renderStripObject(slotIndex, stripObj) {
        const slot = visibleStripSlots[slotIndex];

        if (!stripObj) {
          slot.group.setAttribute("display", "none");
          return;
        }

        const wz0 = stripObj.wz0;
        const wz1 = stripObj.wz1;

        // Skip strips entirely behind the camera near plane
        if (wz1 <= camera.z + 0.15) {
          slot.group.setAttribute("display", "none");
          return;
        }

        slot.group.setAttribute("display", "inline");

        // Relative depth factor across the visible strips [0 near camera -> 1 at VISIBLE_STRIP_COUNT - 1]
        const denom = Math.max(1, VISIBLE_STRIP_COUNT - 1);
        const depthT = Math.max(0.0, Math.min(1.0, slotIndex / denom));
        const horizonFade = Math.pow(depthT, 1.45);

        // ---------------------------------------------------------------------
        // 1. RENDER STRIP TERRAIN PART
        // ---------------------------------------------------------------------
        const nearFillColor = [0, 0, 0];
        const farValleyFillColor = [72, 122, 206];
        const farMountainFillColor = [54, 96, 178];
        const terrainCells = stripObj.terrain.cells;

        for (let c = 0; c < COLS; c++) {
          const poly = slot.terrainPolys[c];
          const cell = terrainCells[c];

          const p00 = project3D(cell.wx0, cell.y00, wz0);
          const p10 = project3D(cell.wx1, cell.y10, wz0);
          const p11 = project3D(cell.wx1, cell.y11, wz1);
          const p01 = project3D(cell.wx0, cell.y01, wz1);

          if (!p00 || !p10 || !p11 || !p01) {
            poly.setAttribute("display", "none");
            continue;
          }

          poly.setAttribute("display", "inline");
          poly.setAttribute("points", formatPoints([p00, p10, p11, p01]));

          const depthFillT = Math.pow(depthT, 1.15);
          const targetFarFill = cell.isMountain ? farMountainFillColor : farValleyFillColor;
          const fillColor = lerpRgb(nearFillColor, targetFarFill, depthFillT);

          const nearLineColor = cell.isMountain ? [196, 138, 255] : [255, 118, 232];
          const farLineColor = cell.isMountain ? [126, 168, 245] : [132, 182, 255];
          const strokeColor = lerpRgb(nearLineColor, farLineColor, depthT);

          poly.setAttribute("fill", fillColor);
          poly.setAttribute("stroke", strokeColor);
          poly.setAttribute("stroke-width", lerp(1.35, 0.55, depthT).toFixed(2));
          poly.setAttribute("stroke-linejoin", "round");
        }

        // ---------------------------------------------------------------------
        // 2. RENDER STRIP ROAD PART
        // ---------------------------------------------------------------------
        const road = stripObj.road;
        const r0Y = road.r0Y;
        const r1Y = road.r1Y;

        const rd00 = project3D(road.r0LeftX, r0Y, wz0);
        const rd10 = project3D(road.r0RightX, r0Y, wz0);
        const rd11 = project3D(road.r1RightX, r1Y, wz1);
        const rd01 = project3D(road.r1LeftX, r1Y, wz1);

        if (!rd00 || !rd10 || !rd11 || !rd01) {
          slot.roadDeckPoly.setAttribute("display", "none");
          slot.roadLeftRailPoly.setAttribute("display", "none");
          slot.roadRightRailPoly.setAttribute("display", "none");
          slot.roadLeftYellowLine.setAttribute("display", "none");
          slot.roadRightYellowLine.setAttribute("display", "none");
          slot.roadCenterTealLine.setAttribute("display", "none");
          return;
        }

        const asphaltColor = lerpRgb([16, 14, 28], [138, 168, 214], horizonFade);
        const asphaltEdgeStroke = lerpRgb([52, 42, 86], [174, 202, 238], horizonFade);

        slot.roadDeckPoly.setAttribute("display", "inline");
        slot.roadDeckPoly.setAttribute("points", formatPoints([rd00, rd10, rd11, rd01]));
        slot.roadDeckPoly.setAttribute("fill", asphaltColor);
        slot.roadDeckPoly.setAttribute("stroke", asphaltEdgeStroke);
        slot.roadDeckPoly.setAttribute("stroke-width", lerp(1.1, 0.5, horizonFade).toFixed(2));
        slot.roadDeckPoly.setAttribute("stroke-linejoin", "round");

        // Side curb/guardrail skirts
        const rl00 = project3D(road.r0LeftX, r0Y, wz0);
        const rl10 = project3D(road.r0LeftX, r0Y - road.railDrop, wz0);
        const rl11 = project3D(road.r1LeftX, r1Y - road.railDrop, wz1);
        const rl01 = project3D(road.r1LeftX, r1Y, wz1);

        const rr00 = project3D(road.r0RightX, r0Y, wz0);
        const rr10 = project3D(road.r0RightX, r0Y - road.railDrop, wz0);
        const rr11 = project3D(road.r1RightX, r1Y - road.railDrop, wz1);
        const rr01 = project3D(road.r1RightX, r1Y, wz1);

        const railColor = lerpRgb([34, 24, 62], [156, 184, 224], horizonFade);

        if (rl00 && rl10 && rl11 && rl01) {
          slot.roadLeftRailPoly.setAttribute("display", "inline");
          slot.roadLeftRailPoly.setAttribute("points", formatPoints([rl00, rl10, rl11, rl01]));
          slot.roadLeftRailPoly.setAttribute("fill", railColor);
          slot.roadLeftRailPoly.setAttribute("stroke", railColor);
          slot.roadLeftRailPoly.setAttribute("stroke-width", "0.6");
        } else {
          slot.roadLeftRailPoly.setAttribute("display", "none");
        }

        if (rr00 && rr10 && rr11 && rr01) {
          slot.roadRightRailPoly.setAttribute("display", "inline");
          slot.roadRightRailPoly.setAttribute("points", formatPoints([rr00, rr10, rr11, rr01]));
          slot.roadRightRailPoly.setAttribute("fill", railColor);
          slot.roadRightRailPoly.setAttribute("stroke", railColor);
          slot.roadRightRailPoly.setAttribute("stroke-width", "0.6");
        } else {
          slot.roadRightRailPoly.setAttribute("display", "none");
        }

        // Yellow side lines
        const yellowLineColor = lerpRgb([255, 212, 38], [255, 248, 198], horizonFade);

        const ly0A = project3D(road.leftYellow0A, r0Y + road.lineLift, wz0);
        const ly0B = project3D(road.leftYellow0B, r0Y + road.lineLift, wz0);
        const ly1B = project3D(road.leftYellow1B, r1Y + road.lineLift, wz1);
        const ly1A = project3D(road.leftYellow1A, r1Y + road.lineLift, wz1);

        if (ly0A && ly0B && ly1B && ly1A) {
          slot.roadLeftYellowLine.setAttribute("display", "inline");
          slot.roadLeftYellowLine.setAttribute("points", formatPoints([ly0A, ly0B, ly1B, ly1A]));
          slot.roadLeftYellowLine.setAttribute("fill", yellowLineColor);
        } else {
          slot.roadLeftYellowLine.setAttribute("display", "none");
        }

        const ry0A = project3D(road.rightYellow0A, r0Y + road.lineLift, wz0);
        const ry0B = project3D(road.rightYellow0B, r0Y + road.lineLift, wz0);
        const ry1B = project3D(road.rightYellow1B, r1Y + road.lineLift, wz1);
        const ry1A = project3D(road.rightYellow1A, r1Y + road.lineLift, wz1);

        if (ry0A && ry0B && ry1B && ry1A) {
          slot.roadRightYellowLine.setAttribute("display", "inline");
          slot.roadRightYellowLine.setAttribute("points", formatPoints([ry0A, ry0B, ry1B, ry1A]));
          slot.roadRightYellowLine.setAttribute("fill", yellowLineColor);
        } else {
          slot.roadRightYellowLine.setAttribute("display", "none");
        }

        // Dashed teal center line
        const tealLineColor = lerpRgb([0, 224, 212], [186, 252, 248], horizonFade);

        const tc0A = project3D(road.center0A, r0Y + road.lineLift, wz0);
        const tc0B = project3D(road.center0B, r0Y + road.lineLift, wz0);
        const tc1B = project3D(road.center1B, r1Y + road.lineLift, wz1);
        const tc1A = project3D(road.center1A, r1Y + road.lineLift, wz1);

        if (road.hasCenterDash && tc0A && tc0B && tc1B && tc1A) {
          slot.roadCenterTealLine.setAttribute("display", "inline");
          slot.roadCenterTealLine.setAttribute("points", formatPoints([tc0A, tc0B, tc1B, tc1A]));
          slot.roadCenterTealLine.setAttribute("fill", tealLineColor);
        } else {
          slot.roadCenterTealLine.setAttribute("display", "none");
        }

        // ---------------------------------------------------------------------
        // 3. RENDER PERSPECTIVE-SCALED FLAT POLYGON PALM TREE (IF PRESENT)
        // ---------------------------------------------------------------------
        const palm = stripPalmPlacements[stripObj.index];
        if (!palm) {
          slot.palmPoly.setAttribute("display", "none");
          return;
        }

        const baseProj = project3D(palm.wx, palm.wy, palm.wz);
        if (!baseProj) {
          slot.palmPoly.setAttribute("display", "none");
          return;
        }

        // Perspective-correct pixel height & width from focal scale
        const screenH = palm.worldHeight * baseProj.scale;
        const tpl = palm.template;
        const pointStrs = new Array(tpl.length);
        for (let k = 0; k < tpl.length; k++) {
          const sx = baseProj.x + tpl[k][0] * screenH;
          const sy = baseProj.y - tpl[k][1] * screenH;
          pointStrs[k] = `${sx.toFixed(1)},${sy.toFixed(1)}`;
        }

        // Silhouette color shifts from deep dark violet-black near camera to misty horizon purple
        const palmFill = lerpRgb([14, 7, 28], [116, 86, 168], horizonFade);
        const palmStroke = lerpRgb([46, 18, 82], [148, 122, 196], horizonFade);

        slot.palmPoly.setAttribute("display", "inline");
        slot.palmPoly.setAttribute("points", pointStrs.join(" "));
        slot.palmPoly.setAttribute("fill", palmFill);
        slot.palmPoly.setAttribute("stroke", palmStroke);
        slot.palmPoly.setAttribute("stroke-width", lerp(0.9, 0.35, horizonFade).toFixed(2));
        slot.palmPoly.setAttribute("stroke-linejoin", "round");
      }

      // Renders only the VISIBLE_STRIP_COUNT pre-generated strips directly in front of the camera.
      function updateWorld() {
        const firstVisibleStripIndex = Math.max(0, Math.floor(camera.z / CELL_D));

        for (let i = 0; i < VISIBLE_STRIP_COUNT; i++) {
          const stripIndex = firstVisibleStripIndex + i;
          const stripObj = stripIndex < TOTAL_STRIPS ? pregeneratedStrips[stripIndex] : null;
          renderStripObject(i, stripObj);
        }
      }

      // =========================================================================
      // 6. ANIMATION LOOP (SLOW CAMERA ADVANCE TOWARD THE HORIZON)
      // =========================================================================
      let lastTimestamp = null;
      const maxTravelZ = (TOTAL_STRIPS - VISIBLE_STRIP_COUNT - 2) * CELL_D;

      function animate(timestamp) {
        if (lastTimestamp === null) {
          lastTimestamp = timestamp;
        }
        const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;
        const elapsedSec = timestamp / 1000;

        // Advance camera slowly forward toward the horizon
        camera.z += camera.speed * dt;
        if (camera.z > maxTravelZ) {
          camera.z = 0;
        }

        // Follow the winding roadway's twists and vertical hills using the frozen baked road surface
        // without mutating any terrain or road heightmap data.
        const currentRoad = getRoadPathAtZ(camera.z);
        const lookAheadRoad = getRoadPathAtZ(camera.z + 18.0);
        const currentRowFloat = Math.max(0.0, Math.min(TOTAL_HEIGHTMAP_ROWS - 1.001, camera.z / CELL_D));
        const bakedRoadY = sampleBakedRoadSurfaceY(currentRowFloat);
        camera.x = lerp(currentRoad.x, lookAheadRoad.x, 0.25);
        camera.y = bakedRoadY + CAMERA_ROAD_CLEARANCE;

        updateStars(elapsedSec);
        updateSun();
        updateWorld();

        requestAnimationFrame(animate);
      }

      // Initial render and start animation loop on window load
      window.addEventListener("load", () => {
        const startRoad = getRoadPathAtZ(camera.z + 4.0);
        const startRowFloat = Math.max(0.0, Math.min(TOTAL_HEIGHTMAP_ROWS - 1.001, camera.z / CELL_D));
        camera.x = startRoad.x;
        camera.y = sampleBakedRoadSurfaceY(startRowFloat) + CAMERA_ROAD_CLEARANCE;

        initStars();
        updateStars(0);
        updateSun();
        updateWorld();
        requestAnimationFrame(animate);
      });
    })();
  </script>
</body>
</html>
