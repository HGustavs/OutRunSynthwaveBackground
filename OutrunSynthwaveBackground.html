<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro 80s Outrun Synthwave Sunset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #030208;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Full-viewport responsive SVG container */
    #scene-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #0d071e 0%, #030208 100%);
    }

    svg#outrun-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="scene-container">
    <!-- Pure SVG viewport with generous aspect ratio so desktop & mobile fill cleanly -->
    <svg id="outrun-svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Deep space sky gradient -->
        <linearGradient id="sky-base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#030208" />
          <stop offset="28%" stop-color="#080516" />
          <stop offset="52%" stop-color="#190a2c" />
          <stop offset="68%" stop-color="#2a1040" />
          <stop offset="100%" stop-color="#05030d" />
        </linearGradient>

        <!-- Asymmetric magenta-left / blue-right horizon nebula glow matching reference -->
        <radialGradient id="magenta-nebula" cx="28%" cy="54%" r="55%">
          <stop offset="0%" stop-color="#8b185a" stop-opacity="0.48" />
          <stop offset="45%" stop-color="#450e3c" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="blue-nebula" cx="74%" cy="52%" r="55%">
          <stop offset="0%" stop-color="#183a7a" stop-opacity="0.48" />
          <stop offset="45%" stop-color="#121e4a" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Central sun aura behind sun -->
        <radialGradient id="sun-aura-grad" cx="50%" cy="52%" r="42%">
          <stop offset="0%" stop-color="#ff3b8d" stop-opacity="0.65" />
          <stop offset="35%" stop-color="#8d2478" stop-opacity="0.32" />
          <stop offset="70%" stop-color="#25164a" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Retro Outrun Sun vertical gradient -->
        <linearGradient id="sun-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fff04d" />
          <stop offset="14%" stop-color="#ffd03b" />
          <stop offset="30%" stop-color="#ff9944" />
          <stop offset="48%" stop-color="#ff6663" />
          <stop offset="68%" stop-color="#fa387c" />
          <stop offset="100%" stop-color="#e31274" />
        </linearGradient>

        <!-- Distant horizon valley atmospheric glow -->
        <radialGradient id="valley-horizon-glow" cx="50%" cy="57%" r="22%">
          <stop offset="0%" stop-color="#b7d4ff" stop-opacity="0.85" />
          <stop offset="35%" stop-color="#6c8cff" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Gaussian blur filter for soft sun & hero star glow -->
        <filter id="sun-outer-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
          <feMerge>
            <feMergeNode in="blur1" />
            <feMergeNode in="blur2" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="star-glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Dynamic ClipPath for the Outrun Sun scanline stripes -->
        <clipPath id="sun-stripes-clip">
          <!-- Populated and updated dynamically by JS in 3D screen space -->
        </clipPath>
      </defs>

      <!-- Layer 1: Sky Backdrop & Nebula Gradients -->
      <g id="layer-sky">
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#sky-base-grad)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#magenta-nebula)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#blue-nebula)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#sun-aura-grad)" />
      </g>

      <!-- Layer 2: 3D Parallax Starfield (Circle over 4-point star) -->
      <g id="layer-stars"></g>

      <!-- Layer 3: 3D Projected Outrun Sun -->
      <g id="layer-sun">
        <!-- Soft glowing halo behind the sun -->
        <circle id="sun-halo" cx="600" cy="480" r="235" fill="url(#sun-body-grad)" opacity="0.32" filter="url(#sun-outer-glow)" />
        <!-- Main striped sun body -->
        <circle id="sun-disc" cx="600" cy="480" r="230" fill="url(#sun-body-grad)" clip-path="url(#sun-stripes-clip)" />
      </g>

      <!-- Layer 4: Subtle horizon mist behind mountains -->
      <rect x="0" y="320" width="1200" height="320" fill="url(#valley-horizon-glow)" pointer-events="none" />

      <!-- Layer 5: 3D Wireframe Terrain & Checkerboard Valley (SVG Polygons) -->
      <g id="layer-terrain"></g>

      <!-- Layer 6: 3D Winding Undulating Highway (SVG Polygons & Lines) -->
      <g id="layer-road"></g>
    </svg>
  </div>

  <script>
    /**
     * Pure SVG + Vanilla JavaScript 3D Synthwave Outrun Renderer
     * Renders 3D stars (circle over 4-point star), 3D receding/approaching sun with scanlines,
     * an infinite procedural 3D wireframe terrain mesh built from SVG <polygon> elements,
     * and an undulating, twisting 3D highway with teal center dashes and yellow edge lines.
     */
    (function () {
      const SVG_NS = "http://www.w3.org/2000/svg";

      // Viewport / Virtual 2D Projection Center
      const VIEW_W = 1200;
      const VIEW_H = 900;
      const CX = VIEW_W / 2;
      const CY = 515; // Horizon line vertical position
      const FOV = 540; // Perspective focal length

      // Camera configuration (moves forward along +Z, tracking the roadway closely)
      const CAMERA_ROAD_CLEARANCE = 7.2; // Lowered camera height closer to the roadway surface
      const camera = {
        x: 0,
        y: CAMERA_ROAD_CLEARANCE,
        z: 0,
        speed: 14.0 // Slow, smooth forward cruise speed toward the horizon
      };

      // DOM Layer references
      const starsLayer = document.getElementById("layer-stars");
      const terrainLayer = document.getElementById("layer-terrain");
      const roadLayer = document.getElementById("layer-road");
      const sunHalo = document.getElementById("sun-halo");
      const sunDisc = document.getElementById("sun-disc");
      const sunClip = document.getElementById("sun-stripes-clip");

      // =========================================================================
      // 1. DETERMINISTIC SEEDED RANDOM & LAYERED NOISE FOR MOUNTAIN HEIGHTMAP
      // =========================================================================
      function hash2D(ix, iz) {
        let n = Math.sin(ix * 127.1 + iz * 311.7) * 43758.5453123;
        return n - Math.floor(n);
      }

      function smoothNoise(x, z) {
        const ix = Math.floor(x);
        const iz = Math.floor(z);
        const fx = x - ix;
        const fz = z - iz;

        // Smooth Hermite interpolation
        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uz = fz * fz * (3.0 - 2.0 * fz);

        const a = hash2D(ix, iz);
        const b = hash2D(ix + 1, iz);
        const c = hash2D(ix, iz + 1);
        const d = hash2D(ix + 1, iz + 1);

        return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
      }

      // Multi-octave fractal noise + sharp ridge noise for crisp 80s wireframe peaks
      function fractalMountainNoise(x, z) {
        let value = 0.0;
        let amp = 0.55;
        let freq = 0.16;

        for (let i = 0; i < 4; i++) {
          const n = smoothNoise(x * freq + i * 19.3, z * freq + i * 7.7);
          // Ridged transformation creates crisp synthwave mountain ridges
          const ridge = 1.0 - Math.abs(n * 2.0 - 1.0);
          value += (n * 0.55 + ridge * ridge * 0.45) * amp;
          freq *= 2.08;
          amp *= 0.48;
        }
        return value;
      }

      // =========================================================================
      // 1B. WINDING & UNDULATING 3D ROADWAY PATH DEFINITION
      // =========================================================================
      const ROAD_HALF_WIDTH = 6.2;

      /**
       * Computes the 3D centerline X, elevation Y, and subtle banking angle of the
       * winding, undulating highway at any world Z coordinate.
       */
      function getRoadPathAtZ(wz) {
        // Gentle start near z = 0, ramping smoothly into sweeping S-curves & hills
        const startBlend = Math.min(1.0, Math.max(0.0, (wz - 14.0) / 55.0));
        const smoothBlend = startBlend * startBlend * (3.0 - 2.0 * startBlend);

        // Multi-frequency horizontal S-curves
        const curveX =
          smoothBlend *
          (24.0 * Math.sin(wz * 0.0115) +
            11.5 * Math.sin(wz * 0.025 + 1.1) +
            4.5 * Math.cos(wz * 0.043 - 0.5));

        // Derivative dX/dZ for subtle road banking into turns
        const dXdZ =
          smoothBlend *
          (24.0 * 0.0115 * Math.cos(wz * 0.0115) +
            11.5 * 0.025 * Math.cos(wz * 0.025 + 1.1) -
            4.5 * 0.043 * Math.sin(wz * 0.043 - 0.5));

        // Smooth rolling hills and dips along the highway
        const hillBlend = Math.min(1.0, Math.max(0.0, (wz - 10.0) / 48.0));
        const smoothHill = hillBlend * hillBlend * (3.0 - 2.0 * hillBlend);
        const rawY =
          smoothHill *
          (4.6 * Math.sin(wz * 0.016 - 0.35) +
            2.4 * Math.sin(wz * 0.034 + 0.9) +
            3.8);

        return {
          x: curveX,
          y: Math.max(0.25, rawY),
          bank: Math.max(-0.22, Math.min(0.22, -dXdZ * 0.32))
        };
      }

      /**
       * Computes static terrain elevation Y at world (x, z) independent of camera position.
       * Central valley corridor follows the winding road path so mountains flank the road,
       * initial rows near z = 0 are flat, and twin mountain ranges rise toward the horizon.
       */
      function computeStaticTerrainHeight(wx, wz) {
        const roadCenter = getRoadPathAtZ(wz);
        const absX = Math.abs(wx - roadCenter.x);

        // Flat central valley corridor following the winding road (half-width ~ 17.5 world units)
        const valleyHalfWidth = 17.5;
        if (absX <= valleyHalfWidth) {
          return 0.0;
        }

        // Initial rows near the starting camera (z < 95) are completely flat,
        // then rise smoothly into full mountain ranges toward the horizon
        const flatStartZ = 95.0;
        if (wz <= flatStartZ) {
          return 0.0;
        }

        const riseRamp = Math.min(1.0, (wz - flatStartZ) / 145.0);
        const zElevationFactor = riseRamp * riseRamp * (3.0 - 2.0 * riseRamp);

        // Smooth ramp outside the central valley
        const distFromRoad = absX - valleyHalfWidth;
        const ramp = Math.min(1.0, distFromRoad / 36.0);
        const smoothRamp = ramp * ramp * (3.0 - 2.0 * ramp);

        // Create prominent flanking mountain ridges near the valley edge, tapering further out
        const ridgeEnvelope = Math.exp(-Math.pow((distFromRoad - 38.0) / 85.0, 2.0)) * 0.78 + 0.34;

        // Combine multi-octave random noise + slight jagged vertex jitter
        const baseNoise = fractalMountainNoise(wx, wz);
        const microJitter = (hash2D(Math.round(wx * 0.5), Math.round(wz * 0.5)) - 0.5) * 0.14;

        // Macro z-modulation so mountain clusters vary naturally along the flight path
        const clusterMod = 0.68 + 0.52 * smoothNoise(wx * 0.03 + 4.1, wz * 0.045);

        const maxPeakHeight = 48.0;
        const height =
          smoothRamp *
          zElevationFactor *
          ridgeEnvelope *
          clusterMod *
          (baseNoise + microJitter) *
          maxPeakHeight;

        return Math.max(0.0, height);
      }

      // =========================================================================
      // 2. 3D PERSPECTIVE PROJECTION HELPER
      // =========================================================================
      function project3D(wx, wy, wz) {
        const dz = wz - camera.z;
        if (dz <= 0.5) return null;

        const scale = FOV / dz;
        const sx = CX + (wx - camera.x) * scale;
        const sy = CY - (wy - camera.y) * scale;
        return { x: sx, y: sy, scale: scale, dz: dz };
      }

      // =========================================================================
      // 3. 3D PARALLAX STARFIELD (SVG CIRCLE OVER 4-POINT STAR)
      // =========================================================================
      const NUM_STARS = 190;
      const STAR_DEPTH_MIN = 180;
      const STAR_DEPTH_MAX = 1150;
      const STAR_SPAN_Z = STAR_DEPTH_MAX - STAR_DEPTH_MIN;
      const stars = [];

      /**
       * Builds SVG polygon points for a crisp 4-point star centered at (0,0)
       */
      function buildFourPointStarPoints(outerR, innerR) {
        const pts = [];
        for (let i = 0; i < 8; i++) {
          const angle = (i * Math.PI) / 4;
          const r = i % 2 === 0 ? outerR : innerR;
          pts.push(`${(Math.cos(angle) * r).toFixed(2)},${(Math.sin(angle) * r).toFixed(2)}`);
        }
        return pts.join(" ");
      }

      (function initStars() {
        for (let i = 0; i < NUM_STARS; i++) {
          const z = STAR_DEPTH_MIN + hash2D(i, 1.3) * STAR_SPAN_Z;
          // Distribute stars across a wide sky dome above the horizon
          const spreadX = (z / FOV) * (VIEW_W * 0.72);
          const wx = (hash2D(i, 7.9) * 2.0 - 1.0) * spreadX;

          const minSkyY = (z / FOV) * 18;
          const maxSkyY = (z / FOV) * (CY * 1.12);
          const wy = camera.y + minSkyY + Math.pow(hash2D(i, 13.7), 0.72) * (maxSkyY - minSkyY);

          // Determine if this star is one of the larger bright sparkle stars
          const isSparkleHero = hash2D(i, 29.1) > 0.92;
          const baseRadius = isSparkleHero
            ? 1.55 + hash2D(i, 31.4) * 0.9
            : 0.65 + hash2D(i, 31.4) * 0.85;

          // Star tint matching magenta-left / blue-right sky ambiance
          let starColor = "#ffffff";
          let spikeColor = "#dbe8ff";
          if (isSparkleHero) {
            if (wx < -30) {
              starColor = "#ffd6f5";
              spikeColor = "#ff7be5";
            } else {
              starColor = "#d9eeff";
              spikeColor = "#6bb5ff";
            }
          } else if (hash2D(i, 41.9) > 0.72) {
            starColor = wx < 0 ? "#f8c8ea" : "#bcd8ff";
            spikeColor = starColor;
          }

          // Group container positioned via 3D projection
          const g = document.createElementNS(SVG_NS, "g");
          if (isSparkleHero) {
            g.setAttribute("filter", "url(#star-glow)");
          }

          // 1) Four-point star underneath
          const fourPoint = document.createElementNS(SVG_NS, "polygon");
          const outerSpike = isSparkleHero ? baseRadius * 4.4 : baseRadius * 2.5;
          const innerWaist = isSparkleHero ? baseRadius * 0.58 : baseRadius * 0.48;
          fourPoint.setAttribute("points", buildFourPointStarPoints(outerSpike, innerWaist));
          fourPoint.setAttribute("fill", spikeColor);
          fourPoint.setAttribute("opacity", isSparkleHero ? "0.92" : "0.72");

          // 2) SVG circle centered directly over the four-point star
          const coreCircle = document.createElementNS(SVG_NS, "circle");
          coreCircle.setAttribute("cx", "0");
          coreCircle.setAttribute("cy", "0");
          coreCircle.setAttribute("r", baseRadius.toFixed(2));
          coreCircle.setAttribute("fill", starColor);

          g.appendChild(fourPoint);
          g.appendChild(coreCircle);
          starsLayer.appendChild(g);

          stars.push({
            el: g,
            wx: wx,
            wy: wy,
            baseZ: z,
            phase: hash2D(i, 53.1) * Math.PI * 2,
            twinkleSpeed: 1.4 + hash2D(i, 67.3) * 2.4,
            isHero: isSparkleHero
          });
        }
      })();

      function updateStars(timeSec) {
        // Stars move slowly in 3D space so they drift gently closer as the camera advances
        const starParallaxZ = camera.z * 0.45;

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          // Wrap star depth seamlessly within [STAR_DEPTH_MIN, STAR_DEPTH_MAX]
          let relZ = (s.baseZ - starParallaxZ - STAR_DEPTH_MIN) % STAR_SPAN_Z;
          if (relZ < 0) relZ += STAR_SPAN_Z;
          const worldZ = camera.z + STAR_DEPTH_MIN + relZ;

          const proj = project3D(s.wx, s.wy, worldZ);
          if (!proj) {
            s.el.setAttribute("opacity", "0");
            continue;
          }

          // Scale star slightly based on its 3D depth
          const depthRatio = 1.0 - relZ / STAR_SPAN_Z; // 0 far -> 1 near
          const perspectiveScale = 0.52 + depthRatio * 0.85;

          // Subtle twinkling opacity
          const twinkle = 0.72 + 0.28 * Math.sin(timeSec * s.twinkleSpeed + s.phase);
          // Fade smoothly when wrapping at far or near boundary
          const edgeFade = Math.min(1.0, relZ / 75.0) * Math.min(1.0, (STAR_SPAN_Z - relZ) / 90.0);

          s.el.setAttribute(
            "transform",
            `translate(${proj.x.toFixed(2)}, ${proj.y.toFixed(2)}) scale(${perspectiveScale.toFixed(3)})`
          );
          s.el.setAttribute("opacity", (twinkle * edgeFade).toFixed(3));
        }
      }

      // =========================================================================
      // 4. 3D OUTRUN RETRO SUN WITH HORIZONTAL SCANLINE CUTOUTS
      // =========================================================================
      // Sun placed 3.5x further back in 3D Z with proportionally scaled radius & Y
      // so initial apparent screen size matches the reference while growing much more slowly
      const SUN_SCALE_FACTOR = 3.5;
      const SUN_WORLD_X = 0;
      const SUN_WORLD_Y = 7.2 + (58 - 7.2) * SUN_SCALE_FACTOR; // Aligned with lowered camera horizon
      const SUN_START_Z = 1450 * SUN_SCALE_FACTOR; // 5075 world units deep
      const SUN_WORLD_RADIUS = 560 * SUN_SCALE_FACTOR; // 1960 world units radius

      // Pre-create SVG <rect> elements inside #sun-stripes-clip
      const NUM_SUN_BANDS = 11;
      const clipRects = [];
      for (let i = 0; i < NUM_SUN_BANDS; i++) {
        const rect = document.createElementNS(SVG_NS, "rect");
        sunClip.appendChild(rect);
        clipRects.push(rect);
      }

      function updateSun() {
        // Slowly approach the distant 3D sun so apparent growth is very subtle
        const sunTravel = (camera.z * 0.18) % (360 * SUN_SCALE_FACTOR);
        const sunWorldZ = SUN_START_Z - sunTravel;

        const projCenter = project3D(SUN_WORLD_X, SUN_WORLD_Y, sunWorldZ);
        if (!projCenter) return;

        // Compute apparent 2D screen radius from 3D world radius
        const screenRadius = SUN_WORLD_RADIUS * projCenter.scale;
        const cx = projCenter.x;
        const cy = projCenter.y;

        sunHalo.setAttribute("cx", cx.toFixed(2));
        sunHalo.setAttribute("cy", cy.toFixed(2));
        sunHalo.setAttribute("r", (screenRadius * 1.03).toFixed(2));

        sunDisc.setAttribute("cx", cx.toFixed(2));
        sunDisc.setAttribute("cy", cy.toFixed(2));
        sunDisc.setAttribute("r", screenRadius.toFixed(2));

        // Update 3D-scaled horizontal scanline bands in the sun's clipPath
        // Top ~52% is solid, lower ~48% has progressively wider horizontal gaps
        const sunTop = cy - screenRadius;
        const sunDiam = screenRadius * 2;

        // Normalized vertical slices [yStartNorm, yEndNorm] matching the retro sun silhouette
        const bands = [
          [0.00, 0.135],
          [0.145, 0.225],
          [0.240, 0.315],
          [0.335, 0.405],
          [0.430, 0.495],
          [0.525, 0.585],
          [0.620, 0.675],
          [0.715, 0.765],
          [0.810, 0.855],
          [0.900, 0.940],
          [0.975, 1.000]
        ];

        for (let i = 0; i < NUM_SUN_BANDS; i++) {
          const [y0, y1] = bands[i];
          const rect = clipRects[i];
          rect.setAttribute("x", (cx - screenRadius - 10).toFixed(2));
          rect.setAttribute("width", (sunDiam + 20).toFixed(2));
          rect.setAttribute("y", (sunTop + y0 * sunDiam).toFixed(2));
          rect.setAttribute("height", Math.max(0.5, (y1 - y0) * sunDiam).toFixed(2));
        }
      }

      // =========================================================================
      // 5. 3D WIREFRAME TERRAIN & CHECKERBOARD VALLEY (SVG POLYGONS)
      // =========================================================================
      const COLS = 84; // Doubled horizontal tile density & wider span extending well past screen edges
      const ROWS = 52; // Increased visible row depth for extended horizon detail
      const CELL_W = 4.2; // Finer horizontal tile width (~2x checker tiles visible per row)
      const CELL_D = 7.0; // Finer Z row spacing for denser terrain data points
      const Z_NEAR_OFFSET = 6.0; // Closest visible row ahead of camera

      // Precompute a large static world heightmap dataset before execution
      // so terrain elevations are completely independent of camera position
      const PRECOMPUTED_TOTAL_ROWS = 480; // Covers 3,360 world units of precomputed terrain rows
      const precomputedHeightMap = new Array(PRECOMPUTED_TOTAL_ROWS);
      (function buildPrecomputedTerrain() {
        const halfCols = COLS / 2;
        for (let r = 0; r < PRECOMPUTED_TOTAL_ROWS; r++) {
          const wz = r * CELL_D;
          const rowHeights = new Float32Array(COLS + 1);
          for (let c = 0; c <= COLS; c++) {
            const wx = (c - halfCols) * CELL_W;
            rowHeights[c] = computeStaticTerrainHeight(wx, wz);
          }
          precomputedHeightMap[r] = rowHeights;
        }
      })();

      function getPrecomputedRowHeights(rowIndex) {
        if (rowIndex < 0) {
          return precomputedHeightMap[0];
        }
        if (rowIndex < PRECOMPUTED_TOTAL_ROWS) {
          return precomputedHeightMap[rowIndex];
        }
        // Seamless wrap into the mountainous region if camera travels past precomputed buffer
        const loopStart = 60;
        const loopSpan = PRECOMPUTED_TOTAL_ROWS - loopStart;
        const wrappedIdx = loopStart + ((rowIndex - loopStart) % loopSpan);
        return precomputedHeightMap[wrappedIdx];
      }

      // Pre-allocate SVG <polygon> pool (painted back-to-front via DOM order)
      const cellPolygons = [];
      (function initTerrainPolygons() {
        // Create from furthest row (ROWS - 1) down to nearest row (0) for painter's algorithm occlusion
        for (let r = ROWS - 1; r >= 0; r--) {
          const rowArr = [];
          for (let c = 0; c < COLS; c++) {
            const poly = document.createElementNS(SVG_NS, "polygon");
            poly.setAttribute("stroke-linejoin", "round");
            terrainLayer.appendChild(poly);
            rowArr.push(poly);
          }
          cellPolygons[r] = rowArr;
        }
      })();

      /**
       * Interpolates RGB color smoothly between two [r, g, b] arrays
       */
      function lerpColor(c1, c2, t) {
        const clamped = Math.max(0, Math.min(1, t));
        const r = Math.round(c1[0] + (c2[0] - c1[0]) * clamped);
        const g = Math.round(c1[1] + (c2[1] - c1[1]) * clamped);
        const b = Math.round(c1[2] + (c2[2] - c1[2]) * clamped);
        return `rgb(${r},${g},${b})`;
      }

      // Color stops for depth-based wireframe stroke & terrain fill
      // Near camera: bright neon magenta-pink (#ff73e6) -> Mid: violet-indigo (#7a68ee) -> Far horizon: ice-cyan-blue (#a4d4ff)
      const STROKE_NEAR = [255, 118, 232];
      const STROKE_MID = [116, 112, 238];
      const STROKE_FAR = [174, 214, 255];

      const FILL_VALLEY_NEAR = [0, 0, 0];
      const FILL_VALLEY_ALT_NEAR = [4, 4, 10];
      const FILL_VALLEY_FAR = [72, 120, 204];

      const FILL_MTN_NEAR = [0, 0, 0];
      const FILL_MTN_FAR = [62, 104, 188];
      const FILL_MTN_PEAK_FAR = [98, 148, 228];

      function updateTerrain() {
        // Snap world Z grid index to camera.z so terrain vertices stay anchored in world space
        const baseRowIndex = Math.floor((camera.z + Z_NEAR_OFFSET) / CELL_D);
        const halfCols = COLS / 2;

        // Precompute projected vertex grid: (ROWS + 1) x (COLS + 1)
        const gridPts = new Array(ROWS + 1);
        const gridHeights = new Array(ROWS + 1);

        for (let r = 0; r <= ROWS; r++) {
          const rowIndex = baseRowIndex + r;
          const wz = rowIndex * CELL_D;
          const rowPts = new Array(COLS + 1);
          const rowH = getPrecomputedRowHeights(rowIndex);

          for (let c = 0; c <= COLS; c++) {
            const wx = (c - halfCols) * CELL_W;
            const wy = rowH[c];
            rowPts[c] = project3D(wx, wy, wz);
          }

          gridPts[r] = rowPts;
          gridHeights[r] = rowH;
        }

        // Update each SVG <polygon> quad from projected 3D corners
        const maxDist = ROWS * CELL_D;

        for (let r = 0; r < ROWS; r++) {
          const rowIndex = baseRowIndex + r;
          const rowZ = rowIndex * CELL_D;
          const relZ = Math.max(0, rowZ - camera.z);
          // Normalized depth: 0.0 at camera, 1.0 at far horizon
          const normZ = Math.min(1.0, relZ / maxDist);

          // Compute depth-dependent wireframe line color
          let strokeColor;
          if (normZ < 0.45) {
            strokeColor = lerpColor(STROKE_NEAR, STROKE_MID, normZ / 0.45);
          } else {
            strokeColor = lerpColor(STROKE_MID, STROKE_FAR, (normZ - 0.45) / 0.55);
          }

          const rowPolys = cellPolygons[r];
          const ptsNear = gridPts[r];
          const ptsFar = gridPts[r + 1];
          const hNear = gridHeights[r];
          const hFar = gridHeights[r + 1];

          for (let c = 0; c < COLS; c++) {
            const poly = rowPolys[c];
            const p00 = ptsNear[c];     // near-left
            const p10 = ptsNear[c + 1]; // near-right
            const p11 = ptsFar[c + 1];  // far-right
            const p01 = ptsFar[c];      // far-left

            if (!p00 || !p10 || !p11 || !p01) {
              poly.setAttribute("visibility", "hidden");
              continue;
            }

            // Frustum cull quads completely outside horizontal viewport bounds
            const minX = Math.min(p00.x, p10.x, p11.x, p01.x);
            const maxX = Math.max(p00.x, p10.x, p11.x, p01.x);
            if (maxX < -60 || minX > VIEW_W + 60) {
              poly.setAttribute("visibility", "hidden");
              continue;
            }

            poly.setAttribute("visibility", "visible");

            // Polygon vertex coordinates string
            const pointsStr =
              `${p00.x.toFixed(1)},${p00.y.toFixed(1)} ` +
              `${p10.x.toFixed(1)},${p10.y.toFixed(1)} ` +
              `${p11.x.toFixed(1)},${p11.y.toFixed(1)} ` +
              `${p01.x.toFixed(1)},${p01.y.toFixed(1)}`;

            // Average elevation of the quad determines mountain shading vs flat checkerboard floor
            const avgH = (hNear[c] + hNear[c + 1] + hFar[c + 1] + hFar[c]) * 0.25;
            const isMountain = avgH > 0.35;

            // Subtle alternating checkerboard tint in the valley + elevation-based ridge shading on mountains
            const isCheckerAlt = ((rowIndex + c) & 1) === 0;
            let fill;
            let stroke = strokeColor;

            // Smooth depth interpolation factor: 0.0 (pure black near camera) -> 1.0 (blue at horizon)
            const depthFillT = Math.pow(normZ, 1.35);

            if (isMountain) {
              // Mountain facets smoothly interpolate from pure black near the camera to atmospheric blue at the horizon
              const elevFactor = Math.min(1.0, avgH / 34.0);
              const farMtnColor = [
                Math.round(FILL_MTN_FAR[0] + (FILL_MTN_PEAK_FAR[0] - FILL_MTN_FAR[0]) * elevFactor),
                Math.round(FILL_MTN_FAR[1] + (FILL_MTN_PEAK_FAR[1] - FILL_MTN_FAR[1]) * elevFactor),
                Math.round(FILL_MTN_FAR[2] + (FILL_MTN_PEAK_FAR[2] - FILL_MTN_FAR[2]) * elevFactor)
              ];
              fill = lerpColor(FILL_MTN_NEAR, farMtnColor, depthFillT);

              // Mountain wireframe shifts slightly cooler blue-white than the foreground road
              stroke = lerpColor(
                [175, 125, 235],
                [195, 224, 255],
                Math.min(1.0, normZ * 0.85 + elevFactor * 0.25)
              );
            } else {
              // Flat valley floor checkerboard polygons interpolate smoothly from black to horizon blue
              const nearColor = isCheckerAlt ? FILL_VALLEY_ALT_NEAR : FILL_VALLEY_NEAR;
              fill = lerpColor(nearColor, FILL_VALLEY_FAR, depthFillT);
            }

            // Stroke width tapers smoothly with distance so horizon lines stay delicate and sharp
            const strokeW = Math.max(0.45, 1.85 * (1.0 - normZ * 0.76));

            poly.setAttribute("points", pointsStr);
            poly.setAttribute("fill", fill);
            poly.setAttribute("stroke", stroke);
            poly.setAttribute("stroke-width", strokeW.toFixed(2));
          }
        }
      }

      // =========================================================================
      // 6. MAIN ANIMATION LOOP
      // =========================================================================
      // 6. 3D WINDING & UNDULATING ROADWAY RENDERER (SVG POLYGONS)
      // =========================================================================
      const ROAD_SEGMENTS = 96; // High subdivision along Z for smooth curves & crests
      const ROAD_SEG_D = 3.8;   // Segment depth in world units (~365 units total visible road)
      const ROAD_NEAR_OFFSET = 2.0;

      // Color interpolation stops for the roadway (fading to lighter hues toward the horizon)
      const ROAD_DECK_NEAR = [8, 7, 22];
      const ROAD_DECK_FAR = [112, 148, 226];

      const ROAD_SIDE_NEAR = [255, 218, 42];     // Vivid yellow side lines near camera
      const ROAD_SIDE_FAR = [255, 252, 205];     // Soft pale pastel yellow at horizon

      const ROAD_CENTER_NEAR = [18, 232, 222];   // Crisp teal center dashes near camera
      const ROAD_CENTER_FAR = [208, 255, 252];   // Light aqua-white at horizon

      const ROAD_SIDEWALL_NEAR = [18, 14, 46];
      const ROAD_SIDEWALL_FAR = [132, 168, 240];

      const roadSegmentElements = [];
      (function initRoadSegments() {
        // Build back-to-front for proper painter's algorithm occlusion over hills/dips
        for (let i = ROAD_SEGMENTS - 1; i >= 0; i--) {
          const g = document.createElementNS(SVG_NS, "g");

          // Elevated bridge side-girder (visible when road rises above valley floor)
          const leftWall = document.createElementNS(SVG_NS, "polygon");
          const rightWall = document.createElementNS(SVG_NS, "polygon");

          // Main asphalt road surface quad
          const deck = document.createElementNS(SVG_NS, "polygon");
          deck.setAttribute("stroke-linejoin", "round");

          // Left & right yellow edge stripes (rendered as crisp perspective quads)
          const leftStripe = document.createElementNS(SVG_NS, "polygon");
          const rightStripe = document.createElementNS(SVG_NS, "polygon");

          // Center teal dashed lane line
          const centerDash = document.createElementNS(SVG_NS, "polygon");

          g.appendChild(leftWall);
          g.appendChild(rightWall);
          g.appendChild(deck);
          g.appendChild(leftStripe);
          g.appendChild(rightStripe);
          g.appendChild(centerDash);
          roadLayer.appendChild(g);

          roadSegmentElements[i] = {
            group: g,
            leftWall: leftWall,
            rightWall: rightWall,
            deck: deck,
            leftStripe: leftStripe,
            rightStripe: rightStripe,
            centerDash: centerDash
          };
        }
      })();

      function quadPointsStr(p00, p10, p11, p01) {
        return (
          `${p00.x.toFixed(1)},${p00.y.toFixed(1)} ` +
          `${p10.x.toFixed(1)},${p10.y.toFixed(1)} ` +
          `${p11.x.toFixed(1)},${p11.y.toFixed(1)} ` +
          `${p01.x.toFixed(1)},${p01.y.toFixed(1)}`
        );
      }

      function updateRoadway() {
        const baseSegIdx = Math.floor((camera.z + ROAD_NEAR_OFFSET) / ROAD_SEG_D);
        const totalRoadDist = ROAD_SEGMENTS * ROAD_SEG_D;

        // Pre-sample cross-section vertices for (ROAD_SEGMENTS + 1) stations
        const stations = new Array(ROAD_SEGMENTS + 1);
        for (let i = 0; i <= ROAD_SEGMENTS; i++) {
          const segIdx = baseSegIdx + i;
          const wz = segIdx * ROAD_SEG_D;
          const path = getRoadPathAtZ(wz);

          // Cross-section offsets for outer edges, yellow side lines, and teal center line
          const wOuter = ROAD_HALF_WIDTH;
          const wStripeOuter = ROAD_HALF_WIDTH - 0.35;
          const wStripeInner = ROAD_HALF_WIDTH - 0.78;
          const wCenterHalf = 0.24;

          const cosB = Math.cos(path.bank);
          const sinB = Math.sin(path.bank);

          const sampleAtOffset = (dx) => {
            const wx = path.x + dx * cosB;
            const wy = path.y + dx * sinB;
            return project3D(wx, wy, wz);
          };

          stations[i] = {
            segIdx: segIdx,
            wz: wz,
            pathY: path.y,
            outerL: sampleAtOffset(-wOuter),
            outerR: sampleAtOffset(wOuter),
            stripeLO: sampleAtOffset(-wStripeOuter),
            stripeLI: sampleAtOffset(-wStripeInner),
            stripeRO: sampleAtOffset(wStripeOuter),
            stripeRI: sampleAtOffset(wStripeInner),
            centerL: sampleAtOffset(-wCenterHalf),
            centerR: sampleAtOffset(wCenterHalf),
            baseL: project3D(path.x - wOuter * cosB, Math.max(0, path.y - 1.45), wz),
            baseR: project3D(path.x + wOuter * cosB, Math.max(0, path.y - 1.45), wz)
          };
        }

        for (let i = 0; i < ROAD_SEGMENTS; i++) {
          const el = roadSegmentElements[i];
          const s0 = stations[i];
          const s1 = stations[i + 1];

          if (!s0.outerL || !s0.outerR || !s1.outerL || !s1.outerR) {
            el.group.setAttribute("visibility", "hidden");
            continue;
          }

          el.group.setAttribute("visibility", "visible");

          const relZ = Math.max(0, s0.wz - camera.z);
          const normZ = Math.min(1.0, relZ / totalRoadDist);
          // Smooth easing so colors brighten gracefully toward the horizon
          const fadeT = Math.pow(normZ, 0.88);

          const deckFill = lerpColor(ROAD_DECK_NEAR, ROAD_DECK_FAR, fadeT);
          const sideColor = lerpColor(ROAD_SIDE_NEAR, ROAD_SIDE_FAR, fadeT);
          const centerColor = lerpColor(ROAD_CENTER_NEAR, ROAD_CENTER_FAR, fadeT);
          const wallColor = lerpColor(ROAD_SIDEWALL_NEAR, ROAD_SIDEWALL_FAR, fadeT);

          // Main road asphalt surface
          el.deck.setAttribute("points", quadPointsStr(s0.outerL, s0.outerR, s1.outerR, s1.outerL));
          el.deck.setAttribute("fill", deckFill);
          el.deck.setAttribute("stroke", deckFill);
          el.deck.setAttribute("stroke-width", "0.6");

          // Subtle elevated road girder sidewalls
          if (s0.baseL && s1.baseL && s0.baseR && s1.baseR && s0.pathY > 0.65) {
            el.leftWall.setAttribute("visibility", "visible");
            el.leftWall.setAttribute("points", quadPointsStr(s0.baseL, s0.outerL, s1.outerL, s1.baseL));
            el.leftWall.setAttribute("fill", wallColor);

            el.rightWall.setAttribute("visibility", "visible");
            el.rightWall.setAttribute("points", quadPointsStr(s0.outerR, s0.baseR, s1.baseR, s1.outerR));
            el.rightWall.setAttribute("fill", wallColor);
          } else {
            el.leftWall.setAttribute("visibility", "hidden");
            el.rightWall.setAttribute("visibility", "hidden");
          }

          // Left & right continuous yellow edge lines fading lighter toward horizon
          if (s0.stripeLO && s0.stripeLI && s1.stripeLI && s1.stripeLO) {
            el.leftStripe.setAttribute("visibility", "visible");
            el.leftStripe.setAttribute("points", quadPointsStr(s0.stripeLO, s0.stripeLI, s1.stripeLI, s1.stripeLO));
            el.leftStripe.setAttribute("fill", sideColor);
          } else {
            el.leftStripe.setAttribute("visibility", "hidden");
          }

          if (s0.stripeRI && s0.stripeRO && s1.stripeRO && s1.stripeRI) {
            el.rightStripe.setAttribute("visibility", "visible");
            el.rightStripe.setAttribute("points", quadPointsStr(s0.stripeRI, s0.stripeRO, s1.stripeRO, s1.stripeRI));
            el.rightStripe.setAttribute("fill", sideColor);
          } else {
            el.rightStripe.setAttribute("visibility", "hidden");
          }

          // Dashed teal center line (3 segments on, 2 segments off) fading lighter toward horizon
          const isDashOn = ((s0.segIdx % 5) + 5) % 5 < 3;
          if (isDashOn && s0.centerL && s0.centerR && s1.centerR && s1.centerL) {
            el.centerDash.setAttribute("visibility", "visible");
            el.centerDash.setAttribute("points", quadPointsStr(s0.centerL, s0.centerR, s1.centerR, s1.centerL));
            el.centerDash.setAttribute("fill", centerColor);
          } else {
            el.centerDash.setAttribute("visibility", "hidden");
          }
        }
      }

      // =========================================================================
      // 7. MAIN ANIMATION LOOP
      // =========================================================================
      let lastTimestamp = null;

      function animate(timestamp) {
        if (lastTimestamp === null) {
          lastTimestamp = timestamp;
        }
        const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;

        // Advance camera slowly toward the horizon along the winding roadway
        camera.z += camera.speed * dt;
        const camRoad = getRoadPathAtZ(camera.z + 4.0);
        camera.x += (camRoad.x - camera.x) * Math.min(1.0, dt * 4.5);
        camera.y += (camRoad.y + CAMERA_ROAD_CLEARANCE - camera.y) * Math.min(1.0, dt * 4.5);

        const timeSec = timestamp * 0.001;

        updateStars(timeSec);
        updateSun();
        updateTerrain();
        updateRoadway();

        requestAnimationFrame(animate);
      }

      // Initial render and start animation loop on window load
      window.addEventListener("load", () => {
        const startRoad = getRoadPathAtZ(camera.z + 4.0);
        camera.x = startRoad.x;
        camera.y = startRoad.y + CAMERA_ROAD_CLEARANCE;

        updateStars(0);
        updateSun();
        updateTerrain();
        updateRoadway();
        requestAnimationFrame(animate);
      });
    })();
  </script>
</body>
</html>
