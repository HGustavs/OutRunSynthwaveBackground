<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro 80s Outrun Synthwave Sunset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #030208;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Full-viewport responsive SVG container */
    #scene-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #0d071e 0%, #030208 100%);
    }

    svg#outrun-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="scene-container">
    <!-- Pure SVG viewport with generous aspect ratio so desktop & mobile fill cleanly -->
    <svg id="outrun-svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Deep space sky gradient -->
        <linearGradient id="sky-base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#030208" />
          <stop offset="28%" stop-color="#080516" />
          <stop offset="52%" stop-color="#190a2c" />
          <stop offset="68%" stop-color="#2a1040" />
          <stop offset="100%" stop-color="#05030d" />
        </linearGradient>

        <!-- Asymmetric magenta-left / blue-right horizon nebula glow matching reference -->
        <radialGradient id="magenta-nebula" cx="28%" cy="54%" r="55%">
          <stop offset="0%" stop-color="#8b185a" stop-opacity="0.48" />
          <stop offset="45%" stop-color="#450e3c" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="blue-nebula" cx="74%" cy="52%" r="55%">
          <stop offset="0%" stop-color="#183a7a" stop-opacity="0.48" />
          <stop offset="45%" stop-color="#121e4a" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Central sun aura behind sun -->
        <radialGradient id="sun-aura-grad" cx="50%" cy="52%" r="42%">
          <stop offset="0%" stop-color="#ff3b8d" stop-opacity="0.65" />
          <stop offset="35%" stop-color="#8d2478" stop-opacity="0.32" />
          <stop offset="70%" stop-color="#25164a" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Retro Outrun Sun vertical gradient -->
        <linearGradient id="sun-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fff04d" />
          <stop offset="14%" stop-color="#ffd03b" />
          <stop offset="30%" stop-color="#ff9944" />
          <stop offset="48%" stop-color="#ff6663" />
          <stop offset="68%" stop-color="#fa387c" />
          <stop offset="100%" stop-color="#e31274" />
        </linearGradient>

        <!-- Distant horizon valley atmospheric glow -->
        <radialGradient id="valley-horizon-glow" cx="50%" cy="57%" r="22%">
          <stop offset="0%" stop-color="#b7d4ff" stop-opacity="0.85" />
          <stop offset="35%" stop-color="#6c8cff" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#05030d" stop-opacity="0" />
        </radialGradient>

        <!-- Gaussian blur filter for soft sun & hero star glow -->
        <filter id="sun-outer-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
          <feMerge>
            <feMergeNode in="blur1" />
            <feMergeNode in="blur2" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="star-glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Dynamic ClipPath for the Outrun Sun scanline stripes -->
        <clipPath id="sun-stripes-clip">
          <!-- Populated and updated dynamically by JS in 3D screen space -->
        </clipPath>
      </defs>

      <!-- Layer 1: Sky Backdrop & Nebula Gradients -->
      <g id="layer-sky">
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#sky-base-grad)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#magenta-nebula)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#blue-nebula)" />
        <rect x="-400" y="-200" width="2000" height="1300" fill="url(#sun-aura-grad)" />
      </g>

      <!-- Layer 2: 3D Parallax Starfield (Circle over 4-point star) -->
      <g id="layer-stars"></g>

      <!-- Layer 3: 3D Projected Outrun Sun -->
      <g id="layer-sun">
        <!-- Soft glowing halo behind the sun -->
        <circle id="sun-halo" cx="600" cy="480" r="235" fill="url(#sun-body-grad)" opacity="0.32" filter="url(#sun-outer-glow)" />
        <!-- Main striped sun body -->
        <circle id="sun-disc" cx="600" cy="480" r="230" fill="url(#sun-body-grad)" clip-path="url(#sun-stripes-clip)" />
      </g>

      <!-- Layer 4: Subtle horizon mist behind mountains -->
      <rect x="0" y="320" width="1200" height="320" fill="url(#valley-horizon-glow)" pointer-events="none" />

      <!-- Layer 5: Unified Back-to-Front 3D Terrain & Roadway Depth Slices (SVG Polygons) -->
      <g id="layer-world"></g>
    </svg>
  </div>

  <script>
    (function () {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const VIEW_W = 1200;
      const VIEW_H = 900;
      const FOCAL_LENGTH = 560;

      // Camera state: lowered closer to the roadway surface and advancing slowly toward the horizon
      const CAMERA_ROAD_CLEARANCE = 7.2;
      const camera = {
        x: 0,
        y: CAMERA_ROAD_CLEARANCE,
        z: 0,
        speed: 14.0
      };

      // DOM Layer references
      const starsLayer = document.getElementById("layer-stars");
      const worldLayer = document.getElementById("layer-world");
      const sunHalo = document.getElementById("sun-halo");
      const sunDisc = document.getElementById("sun-disc");
      const sunClip = document.getElementById("sun-stripes-clip");

      // =========================================================================
      // 1. DETERMINISTIC SEEDED RANDOM, NOISE & WINDING ROAD PATH
      // =========================================================================
      function hash2D(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return n - Math.floor(n);
      }

      function smoothNoise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uy = fy * fy * (3.0 - 2.0 * fy);

        const a = hash2D(ix, iy);
        const b = hash2D(ix + 1, iy);
        const c = hash2D(ix, iy + 1);
        const d = hash2D(ix + 1, iy + 1);

        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }

      function fractalMountainNoise(wx, wz) {
        let total = 0;
        let amp = 0.56;
        let freq = 0.042;
        for (let i = 0; i < 4; i++) {
          total += smoothNoise(wx * freq + i * 19.3, wz * freq - i * 11.7) * amp;
          freq *= 2.08;
          amp *= 0.48;
        }
        return total;
      }

      // Winding, undulating 3D roadway path (twists left/right and rises/dips smoothly)
      const ROAD_HALF_WIDTH = 6.2;

      function getRoadPathAtZ(wz) {
        // Gentle straight start near z = 0, ramping smoothly into wide S-curves and rolling hills
        const introFactor = Math.min(1.0, Math.max(0.0, (wz - 12.0) / 85.0));
        const smoothIntro = introFactor * introFactor * (3.0 - 2.0 * introFactor);

        // Horizontal twists & turns
        const x =
          smoothIntro *
          (24.0 * Math.sin(wz * 0.0115) +
            11.5 * Math.sin(wz * 0.025 + 0.85));

        // Vertical rolling hills (up and down)
        const y =
          smoothIntro *
          (6.5 * Math.sin(wz * 0.0145 - 0.35) +
            3.2 * Math.cos(wz * 0.031 + 0.6) +
            4.2);

        // Subtle banking into turns based on lateral derivative
        const dxDz =
          smoothIntro *
          (24.0 * 0.0115 * Math.cos(wz * 0.0115) +
            11.5 * 0.025 * Math.cos(wz * 0.025 + 0.85));
        const bank = Math.max(-0.18, Math.min(0.18, -dxDz * 0.28));

        return { x, y, bank };
      }

      /**
       * Computes static terrain elevation Y at world (x, z) independent of camera position.
       * Keeps the initial foreground rows completely flat at the road level and rises
       * smoothly into twin mountain ridges toward the horizon, routing around the road.
       */
      function computeStaticTerrainHeight(wx, wz) {
        const road = getRoadPathAtZ(wz);
        const roadBaseY = road.y;

        // Initial rows closest to the camera at start are completely flat at road level
        const flatStartDistance = 95.0;
        if (wz <= flatStartDistance) {
          return roadBaseY;
        }

        // Smooth ramp-up from flat foreground into hills/mountains toward the horizon
        const riseRamp = Math.min(1.0, (wz - flatStartDistance) / 260.0);
        const smoothRise = riseRamp * riseRamp * (3.0 - 2.0 * riseRamp);

        // Keep a smooth valley corridor around the winding roadway so the road sits flush
        const distFromRoad = Math.abs(wx - road.x);
        const corridorInner = ROAD_HALF_WIDTH * 1.15;
        const corridorOuter = ROAD_HALF_WIDTH * 4.2 + smoothRise * 16.0;
        let corridorFactor = 0.0;
        if (distFromRoad > corridorInner) {
          const t = Math.min(1.0, (distFromRoad - corridorInner) / Math.max(1.0, corridorOuter - corridorInner));
          corridorFactor = t * t * (3.0 - 2.0 * t);
        }

        // Twin mountain ridges flanking the winding valley further downrange
        const ridgeCenterDist = 54.0 + smoothNoise(wz * 0.008, 3.1) * 26.0;
        const distFromRidge = Math.abs(distFromRoad - ridgeCenterDist);
        const ridgeEnvelope = Math.exp(-(distFromRidge * distFromRidge) / (2.0 * 38.0 * 38.0));

        const n = fractalMountainNoise(wx, wz);
        const peakSculpt = Math.pow(Math.max(0.0, n), 1.35);

        const mountainLift =
          smoothRise *
          corridorFactor *
          (14.0 + ridgeEnvelope * 54.0) *
          (0.35 + peakSculpt * 1.35);

        // Subtle rolling undulation outside the immediate road bed
        const rollingHills =
          smoothRise *
          corridorFactor *
          (n - 0.35) *
          11.0;

        return roadBaseY + mountainLift + rollingHills;
      }

      /**
       * Conforms precomputed heightmap elevations directly to the road surface height
       * across the roadway corridor before rendering.
       */
      function conformHeightmapToRoadSurface(heightMap, totalRows, cols, cellW, cellD) {
        const roadSurfaceInset = 0.08;
        const blendMargin = cellW * 0.5;
        for (let r = 0; r < totalRows; r++) {
          const wz = r * cellD;
          const road = getRoadPathAtZ(wz);
          const roadSurfaceY = road.y + roadSurfaceInset;
          const rowHeights = heightMap[r];

          for (let c = 0; c <= cols; c++) {
            const wx = (c - cols * 0.5) * cellW;
            const distFromRoad = Math.abs(wx - road.x);
            if (distFromRoad <= ROAD_HALF_WIDTH) {
              rowHeights[c] = roadSurfaceY;
            } else if (distFromRoad < ROAD_HALF_WIDTH + blendMargin) {
              const t = (distFromRoad - ROAD_HALF_WIDTH) / blendMargin;
              const smoothT = t * t * (3.0 - 2.0 * t);
              rowHeights[c] = roadSurfaceY + (rowHeights[c] - roadSurfaceY) * smoothT;
            }
          }
        }
      }

      // =========================================================================
      // 2. 3D PERSPECTIVE PROJECTION HELPER
      // =========================================================================
      function project3D(wx, wy, wz) {
        const dz = wz - camera.z;
        if (dz <= 0.15) {
          return null;
        }
        const dx = wx - camera.x;
        const dy = wy - camera.y;
        const scale = FOCAL_LENGTH / dz;
        return {
          x: VIEW_W * 0.5 + dx * scale,
          y: VIEW_H * 0.52 - dy * scale,
          scale: scale,
          dz: dz
        };
      }

      // =========================================================================
      // 3. 3D PARALLAX STARFIELD (SVG CIRCLE OVER 4-POINT STAR)
      // =========================================================================
      const STAR_COUNT = 135;
      const starEntities = [];

      function createFourPointStarPath(cx, cy, outerR, innerR) {
        const pts = [];
        const spikes = 4;
        for (let i = 0; i < spikes * 2; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const angle = (i * Math.PI) / spikes - Math.PI / 2;
          const px = cx + Math.cos(angle) * r;
          const py = cy + Math.sin(angle) * r;
          pts.push(`${i === 0 ? "M" : "L"}${px.toFixed(2)},${py.toFixed(2)}`);
        }
        pts.push("Z");
        return pts.join(" ");
      }

      function initStars() {
        starsLayer.innerHTML = "";
        starEntities.length = 0;

        const heroTints = [
          "#ffd6f0",
          "#cce6ff",
          "#fff3c4",
          "#f4ccff",
          "#c7fff9"
        ];

        for (let i = 0; i < STAR_COUNT; i++) {
          const s1 = hash2D(i + 1.3, 7.9);
          const s2 = hash2D(i + 4.7, 19.3);
          const s3 = hash2D(i + 11.1, 31.7);
          const s4 = hash2D(i + 23.5, 43.1);

          const isHero = i < 12;
          const wx = (s1 - 0.5) * 1450;
          const wy = 45 + s2 * 440;
          const wz = 420 + s3 * 1850;

          const baseStarSize = isHero ? 7.5 + s4 * 6.5 : 2.2 + s4 * 2.8;
          const circleRatio = isHero ? 0.28 + s1 * 0.1 : 0.34 + s2 * 0.1;
          const tint = isHero ? heroTints[i % heroTints.length] : "#eef4ff";

          const g = document.createElementNS(SVG_NS, "g");
          if (isHero) {
            g.setAttribute("filter", "url(#star-glow)");
          }

          const fourPointPath = document.createElementNS(SVG_NS, "path");
          fourPointPath.setAttribute("fill", tint);
          fourPointPath.setAttribute("opacity", isHero ? "0.95" : "0.78");

          const circleOverlay = document.createElementNS(SVG_NS, "circle");
          circleOverlay.setAttribute("fill", "#ffffff");
          circleOverlay.setAttribute("opacity", isHero ? "0.98" : "0.88");

          g.appendChild(fourPointPath);
          g.appendChild(circleOverlay);
          starsLayer.appendChild(g);

          starEntities.push({
            group: g,
            fourPointPath: fourPointPath,
            circleOverlay: circleOverlay,
            wx: wx,
            wy: wy,
            wz: wz,
            baseStarSize: baseStarSize,
            circleRatio: circleRatio,
            twinklePhase: s4 * Math.PI * 2,
            twinkleSpeed: 1.2 + s3 * 2.4
          });
        }
      }

      function updateStars(elapsedSec) {
        const starSpanZ = 1850;
        for (let i = 0; i < starEntities.length; i++) {
          const st = starEntities[i];

          // Recycle stars smoothly behind camera so they wrap in 3D space as camera advances
          let relZ = st.wz - camera.z;
          while (relZ < 240) {
            st.wz += starSpanZ;
            relZ = st.wz - camera.z;
          }

          const proj = project3D(st.wx, st.wy, st.wz);
          if (!proj || proj.y > VIEW_H * 0.62) {
            st.group.setAttribute("display", "none");
            continue;
          }

          st.group.setAttribute("display", "inline");

          const twinkle = 0.82 + 0.18 * Math.sin(elapsedSec * st.twinkleSpeed + st.twinklePhase);
          const outerR = Math.max(1.4, st.baseStarSize * proj.scale * 220 * twinkle);
          const innerR = outerR * 0.16;
          const circleR = Math.max(0.7, outerR * st.circleRatio);

          st.fourPointPath.setAttribute(
            "d",
            createFourPointStarPath(proj.x, proj.y, outerR, innerR)
          );
          st.circleOverlay.setAttribute("cx", proj.x.toFixed(2));
          st.circleOverlay.setAttribute("cy", proj.y.toFixed(2));
          st.circleOverlay.setAttribute("r", circleR.toFixed(2));
        }
      }

      // =========================================================================
      // 4. 3D PROJECTED OUTRUN SUN & HORIZONTAL SCANLINE STRIPES
      // =========================================================================
      const SUN_START_Z = 5075;
      const SUN_WORLD_RADIUS = 1960;
      const SUN_WORLD_X = 0;
      const SUN_WORLD_Y = 455;

      const SUN_STRIPE_RATIOS = [
        [0.44, 0.025],
        [0.51, 0.035],
        [0.59, 0.045],
        [0.68, 0.055],
        [0.78, 0.068],
        [0.89, 0.082]
      ];

      const sunClipRects = [];
      for (let i = 0; i < 1 + SUN_STRIPE_RATIOS.length; i++) {
        const r = document.createElementNS(SVG_NS, "rect");
        sunClip.appendChild(r);
        sunClipRects.push(r);
      }

      function updateSun() {
        const sunProj = project3D(SUN_WORLD_X, SUN_WORLD_Y, SUN_START_Z);
        if (!sunProj) {
          return;
        }

        const rScreen = SUN_WORLD_RADIUS * sunProj.scale;
        const cx = sunProj.x;
        const cy = sunProj.y;

        sunHalo.setAttribute("cx", cx.toFixed(2));
        sunHalo.setAttribute("cy", cy.toFixed(2));
        sunHalo.setAttribute("r", (rScreen * 1.03).toFixed(2));

        sunDisc.setAttribute("cx", cx.toFixed(2));
        sunDisc.setAttribute("cy", cy.toFixed(2));
        sunDisc.setAttribute("r", rScreen.toFixed(2));

        const topY = cy - rScreen;
        const leftX = cx - rScreen * 1.15;
        const width = rScreen * 2.3;

        let currentY = topY;
        for (let i = 0; i < SUN_STRIPE_RATIOS.length; i++) {
          const [yRatio, hRatio] = SUN_STRIPE_RATIOS[i];
          const gapTop = cy - rScreen + yRatio * (2 * rScreen);
          const gapHeight = hRatio * (2 * rScreen);
          const bandHeight = Math.max(0, gapTop - currentY);

          const rect = sunClipRects[i];
          rect.setAttribute("x", leftX.toFixed(2));
          rect.setAttribute("y", currentY.toFixed(2));
          rect.setAttribute("width", width.toFixed(2));
          rect.setAttribute("height", bandHeight.toFixed(2));

          currentY = gapTop + gapHeight;
        }

        const bottomRect = sunClipRects[sunClipRects.length - 1];
        const bottomBandHeight = Math.max(0, cy + rScreen - currentY);
        bottomRect.setAttribute("x", leftX.toFixed(2));
        bottomRect.setAttribute("y", currentY.toFixed(2));
        bottomRect.setAttribute("width", width.toFixed(2));
        bottomRect.setAttribute("height", bottomBandHeight.toFixed(2));
      }

      // =========================================================================
      // 5. FRONT-TO-BACK 3D TERRAIN & ROADWAY STRIPS (SVG POLYGONS)
      // =========================================================================
      const COLS = 84;
      const ROWS = 52;
      const CELL_W = 4.2;
      const CELL_D = 7.0;
      const TOTAL_HEIGHTMAP_ROWS = 480;

      // Precomputed static elevation table (independent of camera position) and conformed to road surface
      const precomputedHeightMap = new Array(TOTAL_HEIGHTMAP_ROWS);
      for (let r = 0; r < TOTAL_HEIGHTMAP_ROWS; r++) {
        const wz = r * CELL_D;
        const rowHeights = new Float32Array(COLS + 1);
        for (let c = 0; c <= COLS; c++) {
          const wx = (c - COLS * 0.5) * CELL_W;
          rowHeights[c] = computeStaticTerrainHeight(wx, wz);
        }
        precomputedHeightMap[r] = rowHeights;
      }
      conformHeightmapToRoadSurface(precomputedHeightMap, TOTAL_HEIGHTMAP_ROWS, COLS, CELL_W, CELL_D);

      // Reusable pool of strip groups ordered front-to-back (camera -> horizon),
      // with terrainGroup drawn first and roadGroup drawn second within each strip.
      // Because SVG renders later DOM elements on top of earlier ones, appending
      // strips from horizon (ROWS - 1) down to camera (0) ensures near strips
      // are drawn on top of far strips.
      const depthSlices = [];
      for (let r = 0; r < ROWS; r++) {
        const sliceGroup = document.createElementNS(SVG_NS, "g");
        const terrainGroup = document.createElementNS(SVG_NS, "g");
        const roadGroup = document.createElementNS(SVG_NS, "g");
        sliceGroup.appendChild(terrainGroup);
        sliceGroup.appendChild(roadGroup);

        const terrainPolys = [];
        for (let c = 0; c < COLS; c++) {
          const poly = document.createElementNS(SVG_NS, "polygon");
          terrainGroup.appendChild(poly);
          terrainPolys.push(poly);
        }

        const roadDeckPoly = document.createElementNS(SVG_NS, "polygon");
        const roadLeftRailPoly = document.createElementNS(SVG_NS, "polygon");
        const roadRightRailPoly = document.createElementNS(SVG_NS, "polygon");
        const roadLeftYellowLine = document.createElementNS(SVG_NS, "polygon");
        const roadRightYellowLine = document.createElementNS(SVG_NS, "polygon");
        const roadCenterTealLine = document.createElementNS(SVG_NS, "polygon");

        roadGroup.appendChild(roadDeckPoly);
        roadGroup.appendChild(roadLeftRailPoly);
        roadGroup.appendChild(roadRightRailPoly);
        roadGroup.appendChild(roadLeftYellowLine);
        roadGroup.appendChild(roadRightYellowLine);
        roadGroup.appendChild(roadCenterTealLine);

        depthSlices.push({
          group: sliceGroup,
          terrainPolys: terrainPolys,
          roadDeckPoly: roadDeckPoly,
          roadLeftRailPoly: roadLeftRailPoly,
          roadRightRailPoly: roadRightRailPoly,
          roadLeftYellowLine: roadLeftYellowLine,
          roadRightYellowLine: roadRightYellowLine,
          roadCenterTealLine: roadCenterTealLine
        });
      }

      // Append horizon strip first and camera-closest strip last so closer strips
      // sit later in SVG DOM paint order and are never drawn under distant terrain.
      for (let r = ROWS - 1; r >= 0; r--) {
        worldLayer.appendChild(depthSlices[r].group);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpRgb(c1, c2, t) {
        const clamped = Math.max(0.0, Math.min(1.0, t));
        const r = Math.round(lerp(c1[0], c2[0], clamped));
        const g = Math.round(lerp(c1[1], c2[1], clamped));
        const b = Math.round(lerp(c1[2], c2[2], clamped));
        return `rgb(${r}, ${g}, ${b})`;
      }

      function formatPoints(pts) {
        return pts.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      }

      function samplePrecomputedHeight(colIdx, worldRowFloat) {
        const clampedRow = Math.max(0.0, Math.min(TOTAL_HEIGHTMAP_ROWS - 1.001, worldRowFloat));
        const r0 = Math.floor(clampedRow);
        const r1 = Math.min(TOTAL_HEIGHTMAP_ROWS - 1, r0 + 1);
        const frac = clampedRow - r0;
        const h0 = precomputedHeightMap[r0][colIdx];
        const h1 = precomputedHeightMap[r1][colIdx];
        return h0 + (h1 - h0) * frac;
      }

      // Note: getRoadPathAtZ(wz) only computes the 3D road path coordinates;
      // renderStrip(...) renders both terrain and roadway polygons together for a single strip.
      function renderStrip(stripIndex, worldRow0, worldRow1) {
        const slice = depthSlices[stripIndex];

        if (worldRow1 <= 0.05 || worldRow0 >= TOTAL_HEIGHTMAP_ROWS - 1) {
          slice.group.setAttribute("display", "none");
          return;
        }

        slice.group.setAttribute("display", "inline");

        const wz0 = Math.max(0.1, worldRow0 * CELL_D);
        const wz1 = Math.max(wz0 + 0.1, worldRow1 * CELL_D);
        const wzMid = (wz0 + wz1) * 0.5;

        // Back-to-front depth factor: 1.0 at far horizon (stripIndex = ROWS - 1), 0.0 near camera (stripIndex = 0)
        const depthT = Math.max(0.0, Math.min(1.0, stripIndex / (ROWS - 1)));
        const horizonFade = Math.pow(depthT, 1.45);

        // ---------------------------------------------------------------------
        // 1. TERRAIN STRIP POLYGONS (DRAWN FIRST WITHIN THIS STRIP)
        // ---------------------------------------------------------------------
        const nearFillColor = [0, 0, 0];
        const farValleyFillColor = [72, 122, 206];
        const farMountainFillColor = [54, 96, 178];

        for (let c = 0; c < COLS; c++) {
          const poly = slice.terrainPolys[c];
          const wx0 = (c - COLS * 0.5) * CELL_W;
          const wx1 = (c + 1 - COLS * 0.5) * CELL_W;

          const h00 = samplePrecomputedHeight(c, worldRow0);
          const h10 = samplePrecomputedHeight(c + 1, worldRow0);
          const h11 = samplePrecomputedHeight(c + 1, worldRow1);
          const h01 = samplePrecomputedHeight(c, worldRow1);

          const p00 = project3D(wx0, h00, wz0);
          const p10 = project3D(wx1, h10, wz0);
          const p11 = project3D(wx1, h11, wz1);
          const p01 = project3D(wx0, h01, wz1);

          if (!p00 || !p10 || !p11 || !p01) {
            poly.setAttribute("display", "none");
            continue;
          }

          poly.setAttribute("display", "inline");
          poly.setAttribute("points", formatPoints([p00, p10, p11, p01]));

          const roadAtTile = getRoadPathAtZ(wzMid);
          const tileMaxElev = Math.max(h00, h10, h11, h01);
          const elevAboveRoad = Math.max(0.0, tileMaxElev - roadAtTile.y);
          const isMountainTile = elevAboveRoad > 2.2;

          // Smooth fill interpolation from pure black near the camera to blue toward the back
          const depthFillT = Math.pow(depthT, 1.15);
          const targetFarFill = isMountainTile ? farMountainFillColor : farValleyFillColor;
          const fillColor = lerpRgb(nearFillColor, targetFarFill, depthFillT);

          // Grid line color shifts as polygon gets closer to camera
          const nearLineColor = isMountainTile ? [196, 138, 255] : [255, 118, 232];
          const farLineColor = isMountainTile ? [126, 168, 245] : [132, 182, 255];
          const strokeColor = lerpRgb(nearLineColor, farLineColor, depthT);

          poly.setAttribute("fill", fillColor);
          poly.setAttribute("stroke", strokeColor);
          poly.setAttribute("stroke-width", lerp(1.35, 0.55, depthT).toFixed(2));
          poly.setAttribute("stroke-linejoin", "round");
        }

        // ---------------------------------------------------------------------
        // 2. ROADWAY STRIP POLYGONS (DRAWN SECOND WITHIN THIS STRIP)
        // ---------------------------------------------------------------------
        const road0 = getRoadPathAtZ(wz0);
        const road1 = getRoadPathAtZ(wz1);

        // Road surface sits flush with terrain elevation at road center
        const surfaceOffset = 0.08;
        const railDrop = 1.15;

        const r0LeftX = road0.x - ROAD_HALF_WIDTH;
        const r0RightX = road0.x + ROAD_HALF_WIDTH;
        const r1LeftX = road1.x - ROAD_HALF_WIDTH;
        const r1RightX = road1.x + ROAD_HALF_WIDTH;

        const r0Y = road0.y + surfaceOffset;
        const r1Y = road1.y + surfaceOffset;

        const rd00 = project3D(r0LeftX, r0Y, wz0);
        const rd10 = project3D(r0RightX, r0Y, wz0);
        const rd11 = project3D(r1RightX, r1Y, wz1);
        const rd01 = project3D(r1LeftX, r1Y, wz1);

        if (!rd00 || !rd10 || !rd11 || !rd01) {
          slice.roadDeckPoly.setAttribute("display", "none");
          slice.roadLeftRailPoly.setAttribute("display", "none");
          slice.roadRightRailPoly.setAttribute("display", "none");
          slice.roadLeftYellowLine.setAttribute("display", "none");
          slice.roadRightYellowLine.setAttribute("display", "none");
          slice.roadCenterTealLine.setAttribute("display", "none");
          return;
        }

        // Asphalt deck: dark near camera, fading to lighter slate-blue toward horizon
        const asphaltColor = lerpRgb([16, 14, 28], [138, 168, 214], horizonFade);
        const asphaltEdgeStroke = lerpRgb([52, 42, 86], [174, 202, 238], horizonFade);

        slice.roadDeckPoly.setAttribute("display", "inline");
        slice.roadDeckPoly.setAttribute("points", formatPoints([rd00, rd10, rd11, rd01]));
        slice.roadDeckPoly.setAttribute("fill", asphaltColor);
        slice.roadDeckPoly.setAttribute("stroke", asphaltEdgeStroke);
        slice.roadDeckPoly.setAttribute("stroke-width", lerp(1.1, 0.5, horizonFade).toFixed(2));
        slice.roadDeckPoly.setAttribute("stroke-linejoin", "round");

        // Left & right side curb/guardrail skirts fading lighter toward horizon
        const rl00 = project3D(r0LeftX, r0Y, wz0);
        const rl10 = project3D(r0LeftX, r0Y - railDrop, wz0);
        const rl11 = project3D(r1LeftX, r1Y - railDrop, wz1);
        const rl01 = project3D(r1LeftX, r1Y, wz1);

        const rr00 = project3D(r0RightX, r0Y, wz0);
        const rr10 = project3D(r0RightX, r0Y - railDrop, wz0);
        const rr11 = project3D(r1RightX, r1Y - railDrop, wz1);
        const rr01 = project3D(r1RightX, r1Y, wz1);

        const railColor = lerpRgb([34, 24, 62], [156, 184, 224], horizonFade);

        if (rl00 && rl10 && rl11 && rl01) {
          slice.roadLeftRailPoly.setAttribute("display", "inline");
          slice.roadLeftRailPoly.setAttribute("points", formatPoints([rl00, rl10, rl11, rl01]));
          slice.roadLeftRailPoly.setAttribute("fill", railColor);
          slice.roadLeftRailPoly.setAttribute("stroke", railColor);
          slice.roadLeftRailPoly.setAttribute("stroke-width", "0.6");
        } else {
          slice.roadLeftRailPoly.setAttribute("display", "none");
        }

        if (rr00 && rr10 && rr11 && rr01) {
          slice.roadRightRailPoly.setAttribute("display", "inline");
          slice.roadRightRailPoly.setAttribute("points", formatPoints([rr00, rr10, rr11, rr01]));
          slice.roadRightRailPoly.setAttribute("fill", railColor);
          slice.roadRightRailPoly.setAttribute("stroke", railColor);
          slice.roadRightRailPoly.setAttribute("stroke-width", "0.6");
        } else {
          slice.roadRightRailPoly.setAttribute("display", "none");
        }

        // Yellow side lines (continuous along left & right edges, fading to pale cream-yellow at horizon)
        const sideInset = ROAD_HALF_WIDTH * 0.86;
        const sideLineHalfW = 0.24;
        const lineLift = 0.05;
        const yellowLineColor = lerpRgb([255, 212, 38], [255, 248, 198], horizonFade);

        const ly0A = project3D(road0.x - sideInset - sideLineHalfW, r0Y + lineLift, wz0);
        const ly0B = project3D(road0.x - sideInset + sideLineHalfW, r0Y + lineLift, wz0);
        const ly1B = project3D(road1.x - sideInset + sideLineHalfW, r1Y + lineLift, wz1);
        const ly1A = project3D(road1.x - sideInset - sideLineHalfW, r1Y + lineLift, wz1);

        if (ly0A && ly0B && ly1B && ly1A) {
          slice.roadLeftYellowLine.setAttribute("display", "inline");
          slice.roadLeftYellowLine.setAttribute("points", formatPoints([ly0A, ly0B, ly1B, ly1A]));
          slice.roadLeftYellowLine.setAttribute("fill", yellowLineColor);
        } else {
          slice.roadLeftYellowLine.setAttribute("display", "none");
        }

        const ry0A = project3D(road0.x + sideInset - sideLineHalfW, r0Y + lineLift, wz0);
        const ry0B = project3D(road0.x + sideInset + sideLineHalfW, r0Y + lineLift, wz0);
        const ry1B = project3D(road1.x + sideInset + sideLineHalfW, r1Y + lineLift, wz1);
        const ry1A = project3D(road1.x + sideInset - sideLineHalfW, r1Y + lineLift, wz1);

        if (ry0A && ry0B && ry1B && ry1A) {
          slice.roadRightYellowLine.setAttribute("display", "inline");
          slice.roadRightYellowLine.setAttribute("points", formatPoints([ry0A, ry0B, ry1B, ry1A]));
          slice.roadRightYellowLine.setAttribute("fill", yellowLineColor);
        } else {
          slice.roadRightYellowLine.setAttribute("display", "none");
        }

        // Teal center line (dashed along road center, fading to pale aqua-cyan toward horizon)
        const dashCycle = ((Math.floor(worldRow0) % 2) === 0);
        const centerHalfW = 0.22;
        const tealLineColor = lerpRgb([0, 224, 212], [186, 252, 248], horizonFade);

        const tc0A = project3D(road0.x - centerHalfW, r0Y + lineLift, wz0);
        const tc0B = project3D(road0.x + centerHalfW, r0Y + lineLift, wz0);
        const tc1B = project3D(road1.x + centerHalfW, r1Y + lineLift, wz1);
        const tc1A = project3D(road1.x - centerHalfW, r1Y + lineLift, wz1);

        if (dashCycle && tc0A && tc0B && tc1B && tc1A) {
          slice.roadCenterTealLine.setAttribute("display", "inline");
          slice.roadCenterTealLine.setAttribute("points", formatPoints([tc0A, tc0B, tc1B, tc1A]));
          slice.roadCenterTealLine.setAttribute("fill", tealLineColor);
        } else {
          slice.roadCenterTealLine.setAttribute("display", "none");
        }
      }

      function updateWorld() {
        const baseRowFloat = Math.max(0.0, camera.z / CELL_D);
        const startRowInt = Math.floor(baseRowFloat);
        const rowFrac = baseRowFloat - startRowInt;

        // Render strips from closest to the camera (i = 0) toward the horizon (i = ROWS - 1),
        // keeping depthSlices[0] highest in SVG DOM paint order so near terrain is never covered
        // by terrain further toward the horizon.
        for (let i = 0; i < ROWS; i++) {
          const relRowStart = i - rowFrac;
          const relRowEnd = relRowStart + 1.0;

          const worldRow0 = startRowInt + relRowStart;
          const worldRow1 = startRowInt + relRowEnd;

          renderStrip(i, worldRow0, worldRow1);
        }
      }

      // =========================================================================
      // 6. ANIMATION LOOP (SLOW CAMERA ADVANCE TOWARD THE HORIZON)
      // =========================================================================
      let lastTimestamp = null;
      const maxTravelZ = (TOTAL_HEIGHTMAP_ROWS - ROWS - 3) * CELL_D;

      function animate(timestamp) {
        if (lastTimestamp === null) {
          lastTimestamp = timestamp;
        }
        const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;
        const elapsedSec = timestamp / 1000;

        // Advance camera slowly forward toward the horizon
        camera.z += camera.speed * dt;
        if (camera.z > maxTravelZ) {
          camera.z = 0;
        }

        // Follow the winding roadway's twists and vertical hills while staying low to the surface
        const currentRoad = getRoadPathAtZ(camera.z);
        const lookAheadRoad = getRoadPathAtZ(camera.z + 18.0);
        camera.x = lerp(currentRoad.x, lookAheadRoad.x, 0.25);
        camera.y = currentRoad.y + CAMERA_ROAD_CLEARANCE;

        updateStars(elapsedSec);
        updateSun();
        updateWorld();

        requestAnimationFrame(animate);
      }

      // Initial render and start animation loop on window load
      window.addEventListener("load", () => {
        const startRoad = getRoadPathAtZ(camera.z + 4.0);
        camera.x = startRoad.x;
        camera.y = startRoad.y + CAMERA_ROAD_CLEARANCE;

        initStars();
        updateStars(0);
        updateSun();
        updateWorld();
        requestAnimationFrame(animate);
      });
    })();
  </script>
</body>
</html>
